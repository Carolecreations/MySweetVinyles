(function(){
  function initDateFlex(){
    if(typeof GROUPS === "undefined" || typeof App === "undefined"){
      setTimeout(initDateFlex, 200);
      return;
    }
    if(window.__dateFlexInit) return;
    window.__dateFlexInit = true;

    const valeurGroup = GROUPS.find(g => g.id === "valeur");
    const dateField = valeurGroup ? valeurGroup.fields.find(f => f.key === "date_achat") : null;

    function displayDateAchat(raw){
      if(!raw) return "";
      const s = String(raw).trim();
      if(/^\d{4}$/.test(s)) return s;
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
        const [y, m, d] = s.split("-");
        const date = new Date(parseInt(y,10), parseInt(m,10)-1, parseInt(d,10));
        if(!isNaN(date.getTime())){
          return date.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
        }
      }
      if(/^\d{4}-\d{2}$/.test(s)){
        const [y, m] = s.split("-");
        const MOIS = ["janvier","février","mars","avril","mai","juin",
                     "juillet","août","septembre","octobre","novembre","décembre"];
        const idx = parseInt(m,10) - 1;
        if(idx >= 0 && idx < 12) return MOIS[idx] + " " + y;
      }
      if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
        const [d, m, y] = s.split("/");
        const date = new Date(parseInt(y,10), parseInt(m,10)-1, parseInt(d,10));
        if(!isNaN(date.getTime())){
          return date.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
        }
      }
      if(/^\d{1,2}\/\d{4}$/.test(s)){
        const [m, y] = s.split("/");
        const MOIS = ["janvier","février","mars","avril","mai","juin",
                     "juillet","août","septembre","octobre","novembre","décembre"];
        const idx = parseInt(m,10) - 1;
        if(idx >= 0 && idx < 12) return MOIS[idx] + " " + y;
      }
      return s;
    }
    window.displayDateAchat = displayDateAchat;

    function normalizeDateAchat(raw){
      const s = String(raw || "").trim();
      if(!s) return "";
      if(/^\d{4}$/.test(s)) return s;
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if(/^\d{4}-\d{2}$/.test(s)) return s;
      if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
        const [d, m, y] = s.split("/");
        return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      }
      if(/^\d{1,2}\/\d{4}$/.test(s)){
        const [m, y] = s.split("/");
        return y + "-" + String(m).padStart(2,"0");
      }
      return s;
    }

    const originalRenderForm = window.renderForm;
    window.renderForm = function(v){
      const rawValue = v ? (v.date_achat || "") : "";
      originalRenderForm(v);
      const input = document.querySelector('#vinylForm [data-key="date_achat"]');
      if(input){
        input.type = "text";
        input.value = rawValue;
        input.placeholder = "1973 · 06/1973 · 14/06/1973";
        input.setAttribute("autocomplete", "off");
        input.title = "Année seule acceptée si vous ne vous souvenez pas du jour exact";
        const wrapper = input.parentNode;
        if(wrapper && !wrapper.querySelector('.date-hint')){
          const hint = document.createElement('div');
          hint.className = 'date-hint';
          hint.style.cssText = 'font-size:10.5px;color:var(--creme-faint);margin-top:5px;font-style:italic;line-height:1.4;';
          hint.textContent = '💡 Année seule acceptée (ex. 1973) — pas besoin du jour exact.';
          wrapper.appendChild(hint);
        }
      }
    };

    const originalReadForm = App.readForm;
    App.readForm = function(){
      const data = originalReadForm.call(this);
      if(data && data.date_achat){
        data.date_achat = normalizeDateAchat(data.date_achat);
      }
      return data;
    };

    const originalRenderDetail = window.renderDetail;
    window.renderDetail = function(v){
      originalRenderDetail(v);
      if(!v.date_achat) return;
      const display = displayDateAchat(v.date_achat);
      const items = document.querySelectorAll('#detailModal .data-item');
      for(const item of items){
        const k = item.querySelector('.k');
        if(k && /date\s*d'achat/i.test(k.textContent)){
          const vEl = item.querySelector('.v');
          if(vEl) vEl.textContent = display;
          break;
        }
      }
    };

    if(typeof window.fichePrintBody === "function"){
      const originalFichePrintBody = window.fichePrintBody;
      window.fichePrintBody = function(v){
        const copy = Object.assign({}, v);
        if(copy.date_achat){
          copy.date_achat = displayDateAchat(copy.date_achat);
        }
        const origType = dateField ? dateField.type : null;
        if(dateField) dateField.type = "text";
        try {
          return originalFichePrintBody(copy);
        } finally {
          if(dateField && origType !== null) dateField.type = origType;
        }
      };
    }

    console.log("%c📅 Date d'achat flexible activée (année / mois / jour)", "color:#C9A86A;font-weight:bold");
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", initDateFlex);
  } else {
    initDateFlex();
  }
})();
  /* ═══════════════════════════════════════════════════════════════════
   MODE « ÉDITIONS RARES » — Discogs + indices locaux + cache local
   ═══════════════════════════════════════════════════════════════════ */
const Rare = {
  KEY: "vinylArchiveJacques.cacheRare",
  TTL: 30 * 24 * 3600 * 1000,
  scan: { running:false, stop:false, done:0, total:0, current:"", info:"" },
  filtre: "rares",
  _bound: false,

  loadCache(){ try { return JSON.parse(localStorage.getItem(this.KEY) || "{}") || {}; } catch(e){ return {}; } },
  saveCache(c){ try { localStorage.setItem(this.KEY, JSON.stringify(c)); } catch(e){ console.warn("Cache Éditions rares plein", e); } },
  keyOf(v){ return [normStr(v.artiste), normStr(v.titre), normStr(v.catalogue), v.annee_impression || ""].join("|"); },
  valide(e){ return !!e && (Date.now() - e.t) < this.TTL; },
  collection(){ return State.vinyles.filter(v => v.statut !== "Recherché"); },
  pause(ms){
    return new Promise(res => {
      const fin = Date.now() + ms;
      const tick = () => { if(this.scan.stop || Date.now() >= fin) res(); else setTimeout(tick, 400); };
      tick();
    });
  },

  evaluer(v, info){
    let score = 0; const raisons = [];
    const add = (pts, txt) => { score += pts; raisons.push(txt); };
    const an = parseInt(v.annee_impression, 10);
    if(an && an < 1970) add(1, "Pressage d'avant 1970");
    if(/1st|first|original|orig|premier/i.test(v.pressage || "")) add(1, "Pressage original");
    if(v.couleur_vinyle && !/^(noir|black)$/i.test(String(v.couleur_vinyle).trim())) add(1, "Vinyle de couleur");
    const verifie = !!(info && !info.none);
    if(verifie){
      const have = info.have, want = info.want;
      if(typeof have === "number" && have > 0){
        if(have < 30) add(2, "Très peu de possesseurs (" + have + ")");
        else if(have < 150) add(1, "Peu de possesseurs (" + have + ")");
        if(have >= 5 && typeof want === "number"){
          const r = want / have;
          if(r >= 1.5) add(3, "Très demandé (" + want + " cherchent, " + have + " possèdent)");
          else if(r >= 0.75) add(2, "Demandé (" + want + " cherchent, " + have + " possèdent)");
          else if(r >= 0.35) add(1, "Plutôt demandé (" + want + " pour " + have + ")");
        }
      }
      if(typeof info.forSale === "number"){
        if(info.forSale === 0) add(2, "Aucun exemplaire en vente");
        else if(info.forSale <= 3) add(2, "Seulement " + info.forSale + " en vente");
        else if(info.forSale <= 10) add(1, "Seulement " + info.forSale + " en vente");
      }
      if(typeof info.lowest === "number" && isFinite(info.lowest)){
        if(info.lowest >= 150) add(4, "Dès " + fmtEuro(info.lowest) + " sur Discogs");
        else if(info.lowest >= 60) add(3, "Dès " + fmtEuro(info.lowest) + " sur Discogs");
        else if(info.lowest >= 30) add(2, "Dès " + fmtEuro(info.lowest) + " sur Discogs");
        else if(info.lowest >= 15) add(1, "Dès " + fmtEuro(info.lowest) + " sur Discogs");
      }
    }
    const niveau = score >= 10 ? "Collector" : score >= 7 ? "Très rare" : score >= 5 ? "Rare" : score >= 3 ? "Peu courant" : "Courant";
    return { score, niveau, raisons, verifie };
  },

  lignes(){
    const cache = this.loadCache();
    return this.collection().map(v => {
      const info = cache[this.keyOf(v)] || null;
      const ev = this.evaluer(v, info);
      return { v, info, ev, declare: RANG_RARETE[v.rarete] ?? -1, suggere: RANG_RARETE[ev.niveau] ?? 0 };
    }).sort((a, b) => b.ev.score - a.ev.score);
  },
  aRevoir(l){ return l.suggere > l.declare && l.suggere >= 2; },
  filtrer(lignes){
    const f = this.filtre;
    return lignes.filter(l => f === "tous" ? true : f === "surveiller" ? l.ev.score >= 3 : f === "revoir" ? this.aRevoir(l) : l.ev.score >= 5);
  },

  open(){
    if(!this._bound){
      this._bound = true;
      const m = $("#rareModal");
      m.addEventListener("click", e => {
        const t = e.target.closest("[data-rare-act],[data-rare-open],[data-rare-apply]"); if(!t) return;
        if(t.dataset.rareOpen){ App.openDetail(t.dataset.rareOpen); return; }
        if(t.dataset.rareApply){ this.appliquer(t.dataset.rareApply, t.dataset.niveau); return; }
        const a = t.dataset.rareAct;
        if(a === "close") this.close();
        else if(a === "scan") this.lancer(false);
        else if(a === "rescan") this.lancer(true);
        else if(a === "stop"){ this.scan.stop = true; this.scan.info = "Arrêt en cours…"; this.majProgress(); }
        else if(a === "clear"){
          if(this.scan.running){ toast("Éditions rares", "Arrêtez d'abord l'analyse en cours.", true); return; }
          if(confirm("Vider le cache local des analyses Discogs ? Vos fiches ne sont pas touchées.")){ try { localStorage.removeItem(this.KEY); } catch(e){} this.render(); }
        }
      });
      m.addEventListener("change", e => {
        if(e.target && e.target.id === "rareFiltre"){ this.filtre = e.target.value; this.renderListe(); }
      });
    }
    this.render();
    $("#rareOverlay").classList.add("open"); document.body.style.overflow = "hidden"; $("#rareOverlay").scrollTop = 0;
  },
  close(){ $("#rareOverlay").classList.remove("open"); document.body.style.overflow = ""; },

  render(){
    const m = $("#rareModal"); if(!m) return;
    const token = !!Settings.data.discogsToken;
    const s = this.scan;
    const cache = this.loadCache();
    const vus = new Set();
    const aFaire = this.collection().filter(v => { const k = this.keyOf(v); if(vus.has(k)) return false; vus.add(k); return !this.valide(cache[k]); }).length;
    const minutes = Math.max(1, Math.ceil(aFaire * 3 / 60));
    m.innerHTML = `
      <div class="modal-head" style="align-items:center">
        <button class="btn-back" data-rare-act="close" title="Retour à la bibliothèque"><span class="arrow">←</span> Retour</button>
        <div style="flex:1;min-width:0"><h2>Éditions rares</h2><div class="sub">Détection Discogs + indices de votre fiche</div></div>
        <button class="close-x" data-rare-act="close" title="Fermer">✕</button>
      </div>
      <div class="form-body">
        <p class="rare-intro">Chaque disque reçoit un <strong>score de rareté</strong> : nombre de possesseurs et de demandeurs sur Discogs, exemplaires en vente, prix le plus bas, plus les indices de votre fiche (pressage original, avant 1970, vinyle de couleur). Les résultats sont gardés dans un <strong>cache local</strong> (30 jours) : une seule analyse suffit, puis tout est instantané.
        <br><span style="opacity:.75">Popsike n'a pas d'accès automatique : son bouton ouvre la recherche pour <strong>confirmer les prix de vente réels</strong> des disques repérés.</span></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          ${s.running
            ? `<button class="btn sm" data-rare-act="stop">■ Arrêter l'analyse</button>`
            : (token
                ? `<button class="btn sm primary" data-rare-act="scan">▶ Analyser${aFaire ? " (" + aFaire + " disque" + (aFaire > 1 ? "s" : "") + " · ≈ " + minutes + " min)" : " — tout est à jour"}</button>
                   <button class="btn sm ghost" data-rare-act="rescan">↻ Tout réanalyser</button>`
                : `<span class="hint">Pour analyser avec Discogs, renseignez votre token dans ⚙︎ Paramètres. Sans lui, seuls les indices de vos fiches sont utilisés.</span>`)}
          <button class="btn sm ghost" data-rare-act="clear" ${s.running ? "disabled" : ""}>Vider le cache</button>
        </div>
        <div id="rareProgress" style="display:${s.running ? "block" : "none"}">
          <div class="rare-bar"><i id="rareBar"></i></div>
          <div class="hint" id="rareProgressTxt" style="margin-top:8px"></div>
        </div>
        <div class="divider"></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between">
          <div class="field" style="margin:0;min-width:240px"><label>Afficher</label>
            <select id="rareFiltre">
              <option value="rares" ${this.filtre === "rares" ? "selected" : ""}>Rares et plus (score ≥ 5)</option>
              <option value="surveiller" ${this.filtre === "surveiller" ? "selected" : ""}>À surveiller et plus (score ≥ 3)</option>
              <option value="revoir" ${this.filtre === "revoir" ? "selected" : ""}>Rareté à revoir (supérieure à celle notée)</option>
              <option value="tous" ${this.filtre === "tous" ? "selected" : ""}>Toute la collection</option>
            </select></div>
          <div id="rareCompteurs" class="hint"></div>
        </div>
        <div id="rareListe"></div>
      </div>`;
    this.renderListe(); this.majProgress();
  },

  renderListe(){
    const box = $("#rareListe"); if(!box) return;
    const lignes = this.lignes();
    const visibles = this.filtrer(lignes);
    const analyses = lignes.filter(l => l.info && !l.info.none).length;
    const rares = lignes.filter(l => l.ev.score >= 5).length;
    const revoir = lignes.filter(l => this.aRevoir(l)).length;
    const c = $("#rareCompteurs");
    if(c) c.innerHTML = `${lignes.length} disque${lignes.length > 1 ? "s" : ""} · ${analyses} analysé${analyses > 1 ? "s" : ""} · <strong>${rares}</strong> rare${rares > 1 ? "s" : ""} · ${revoir} à revoir`;
    const LIMITE = 150;
    if(!visibles.length){
      box.innerHTML = `<div class="hint" style="padding:26px 0;text-align:center">${lignes.length ? "Aucun disque dans cette catégorie pour le moment." : "La collection est vide."}</div>`;
      return;
    }
    box.innerHTML = visibles.slice(0, LIMITE).map(l => this.rowHTML(l)).join("")
      + (visibles.length > LIMITE ? `<div class="hint" style="padding:16px 0;text-align:center">… et ${visibles.length - LIMITE} autres (affinez avec le filtre).</div>` : "");
  },

  rowHTML(l){
    const { v, info, ev } = l;
    const liens = priceSearchLinks(v);
    const hi = ev.score >= 7;
    const stats = (info && !info.none) ? [
      typeof info.have === "number" ? info.have + " possèdent" : "",
      typeof info.want === "number" ? info.want + " cherchent" : "",
      typeof info.forSale === "number" ? info.forSale + " en vente" : "",
      typeof info.lowest === "number" ? "dès " + fmtEuro(info.lowest) : ""
    ].filter(Boolean).join(" · ") : "";
    const etat = (info && info.none) ? "Introuvable sur Discogs"
      : ev.verifie ? "Discogs · analysé le " + new Date(info.t).toLocaleDateString("fr-FR")
      : "Non vérifié (indices de la fiche seulement)";
    const declareTxt = v.rarete ? "Notée « " + v.rarete + " »" : "Rareté non notée";
    const lienDiscogs = (info && info.url) ? info.url : (liens ? liens.discogs : null);
    return `<div class="rare-row">
      <div class="rare-thumb">${v.image_pochette ? `<img loading="lazy" src="${esc(v.image_pochette)}" alt="">` : "♪"}</div>
      <div>
        <div class="rare-title" data-rare-open="${esc(v.id)}">${esc(v.titre || "Sans titre")} <span style="opacity:.6;font-size:13px">— ${esc(v.artiste || "")}</span></div>
        <div class="rare-meta">${esc([v.annee_impression, v.label, v.pays, v.pressage].filter(Boolean).join(" · "))}</div>
        <div class="rare-meta">${esc(etat)}${stats ? " — " + esc(stats) : ""}</div>
        <div class="rare-reasons">${ev.raisons.map(r => `<span class="rare-chip">${esc(r)}</span>`).join("") || `<span class="rare-meta">Aucun indice de rareté</span>`}</div>
      </div>
      <div class="rare-side">
        <span class="rare-lvl ${hi ? "hi" : ""}" title="Score ${ev.score}">${esc(ev.niveau)} · ${ev.score}</span>
        <span class="rare-meta">${esc(declareTxt)}</span>
        <div class="rare-actions">
          ${this.aRevoir(l) ? `<button class="btn sm" data-rare-apply="${esc(v.id)}" data-niveau="${esc(ev.niveau)}">Noter « ${esc(ev.niveau)} »</button>` : ""}
          ${liens ? `<a class="btn sm ghost" href="${esc(liens.popsike)}" target="_blank" rel="noopener" title="Ventes aux enchères passées sur Popsike" style="text-decoration:none">Popsike</a>` : ""}
          ${lienDiscogs ? `<a class="btn sm ghost" href="${esc(lienDiscogs)}" target="_blank" rel="noopener" style="text-decoration:none">Discogs</a>` : ""}
        </div>
      </div>
    </div>`;
  },

  majProgress(){
    const s = this.scan, bar = $("#rareBar"), txt = $("#rareProgressTxt"), box = $("#rareProgress");
    if(!bar || !txt) return;
    if(box) box.style.display = s.running ? "block" : "none";
    bar.style.width = (s.total ? Math.round(100 * s.done / s.total) : 0) + "%";
    txt.textContent = s.info || (s.running ? `${s.done} / ${s.total} · ${s.current}` : "");
  },

  async appliquer(id, niveau){
    const v = State.vinyles.find(x => x.id === id); if(!v || !niveau) return;
    v.rarete = niveau; v.date_modif = new Date().toISOString();
    try { await Store.put(v); App.refresh(false); this.renderListe(); toast("Rareté mise à jour", `${v.titre} → ${niveau}`); }
    catch(e){ toast("Erreur", e.message, true); }
  },

  async lancer(force){
    const token = Settings.data.discogsToken;
    if(!token){ toast("Éditions rares", "Renseignez votre token Discogs dans les Paramètres ⚙︎", true); return; }
    const s = this.scan; if(s.running) return;
    const cache = this.loadCache();
    const vus = new Set();
    const file = this.collection().filter(v => {
      const k = this.keyOf(v); if(vus.has(k)) return false; vus.add(k);
      return force || !this.valide(cache[k]);
    });
    if(!file.length){ toast("Éditions rares", "Tout est déjà à jour dans le cache local."); return; }
    Object.assign(s, { running:true, stop:false, done:0, total:file.length, current:"", info:"" });
    this.render();
    let erreursReseau = 0, interrompu = false;
    for(const v of file){
      if(s.stop) break;
      s.current = [v.artiste, v.titre].filter(Boolean).join(" – ");
      this.majProgress();
      const k = this.keyOf(v);
      let tentative = 0, fait = false;
      while(!fait && tentative < 2 && !s.stop){
        tentative++;
        try {
          const r = await discogsFetch(v, token, { suggest:false });
          cache[k] = { t:Date.now(), have:r.have, want:r.want, forSale:r.forSale, lowest:r.statsLowest, label:r.label, url:r.url };
          fait = true; erreursReseau = 0;
        } catch(e){
          const msg = String((e && e.message) || e);
          if(/429/.test(msg)){
            s.info = "Quota Discogs atteint — pause d'une minute…"; this.majProgress();
            await this.pause(65000);
            s.info = "";
          } else if(/401/.test(msg)){
            toast("Discogs", msg, true); s.stop = true; interrompu = true; fait = true;
          } else if(/Aucune correspondance|Aucun résultat/.test(msg)){
            cache[k] = { t:Date.now(), none:true }; fait = true; erreursReseau = 0;
          } else {
            erreursReseau++; fait = true;
            if(erreursReseau >= 3){ toast("Éditions rares", "Connexion à Discogs impossible : analyse interrompue.", true); s.stop = true; interrompu = true; }
          }
        }
      }
      if(!fait && !s.stop){ toast("Discogs", "Quota toujours atteint : reprenez dans quelques minutes (le cache est conservé).", true); s.stop = true; interrompu = true; }
      s.done++;
      this.saveCache(cache);
      if(s.done % 3 === 0) this.renderListe();
      this.majProgress();
      if(!s.stop) await this.pause(2200);
    }
    const stoppe = s.stop;
    s.running = false; s.stop = false; s.info = "";
    this.render();
    if(!interrompu) toast("Éditions rares", stoppe ? `Analyse arrêtée (${s.done}/${s.total}) — le cache est conservé.` : `Analyse terminée : ${s.total} disque${s.total > 1 ? "s" : ""}.`);
  }
};

/* ═══════════════════════════════════════════════════════════════════
   FICHE « MUSÉE » — fanart, logo, bio, clip (TheAudioDB) + palette
   ═══════════════════════════════════════════════════════════════════ */
const Musee = {
  KEY: "vinylArchiveJacques.cacheMusee",
  TTL: 30 * 24 * 3600 * 1000,
  token: 0, lastId: null, _bound: false, bio: null, pal: new Map(),

  actif(){ return Settings.data.musee !== false; },
  hash(str){ let h = 0; for(const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; },
  cacheGet(k){ try { const c = JSON.parse(localStorage.getItem(this.KEY) || "{}"); const e = c[k]; return e && (Date.now() - e.t) < this.TTL ? e.d : null; } catch(e){ return null; } },
  cacheSet(k, d){
    try {
      const c = JSON.parse(localStorage.getItem(this.KEY) || "{}");
      c[k] = { t: Date.now(), d };
      const cles = Object.keys(c);
      if(cles.length > 600){ cles.sort((a, b) => c[a].t - c[b].t).slice(0, 100).forEach(x => delete c[x]); }
      localStorage.setItem(this.KEY, JSON.stringify(c));
    } catch(e){}
  },
  async api(chemin, params){
       const key = (Settings.data.audiodbKey || "123").trim() || "123";
    const res = await fetch(`https://www.theaudiodb.com/api/v1/json/${encodeURIComponent(key)}/${chemin}?` + new URLSearchParams(params));
    if(!res.ok) throw new Error("TheAudioDB HTTP " + res.status);
    return res.json();
  },
  async artiste(v){
    const k = "a|" + normStr(v.artiste);
    let d = this.cacheGet(k); if(d) return d;
    const j = await this.api("search.php", { s: v.artiste });
    const arr = (j && j.artists) || [];
    if(!arr.length){ d = { none:true }; this.cacheSet(k, d); return d; }
    const nA = normStr(v.artiste).trim();
    const a = arr.find(x => normStr(x.strArtist).trim() === nA) || arr[0];
    const bio = String(a.strBiographyFR || a.strBiographyEN || "").trim();
    d = {
      id: a.idArtist || null, nom: a.strArtist || v.artiste,
      fanart: [a.strArtistFanart, a.strArtistFanart2, a.strArtistFanart3, a.strArtistFanart4].filter(Boolean),
      logo: a.strArtistLogo || null, bio: bio.slice(0, 1800), bioLang: a.strBiographyFR ? "fr" : "en"
    };
    this.cacheSet(k, d); return d;
  },
  async clip(idAlbum, idArtist){
    const yt = u => { const m = String(u || "").match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? m[1] : null; };
    try {
      const j = await this.api("track.php", { m: idAlbum });
      const t = ((j && j.track) || []).find(x => yt(x.strMusicVid));
      if(t) return { id: yt(t.strMusicVid), titre: t.strTrack || "", source: "album" };
    } catch(e){}
    try {
      if(idArtist){
        const j = await this.api("mvid.php", { i: idArtist });
        const t = ((j && j.mvids) || []).find(x => yt(x.strMusicVid));
        if(t) return { id: yt(t.strMusicVid), titre: t.strTrack || "", source: "artiste" };
      }
    } catch(e){}
    return null;
  },
  async album(v, artisteId){
    if(!v.titre) return null;
    const k = "b|" + normStr(v.artiste) + "|" + normStr(v.titre);
    let d = this.cacheGet(k); if(d) return d;
    let r = null;
    try { r = await audiodbFetchRaw(v); } catch(e){ if(!/Aucune correspondance/.test(e.message)) throw e; }
    d = r ? { id: r.idAlbum, thumb: r.cover, annee: r.annee } : { none:true };
    if(r && r.idAlbum) d.clip = await this.clip(r.idAlbum, artisteId || r.idArtist);
    this.cacheSet(k, d); return d;
  },
  async donnees(v){
    let art = null, alb = null;
    try { art = await this.artiste(v); } catch(e){}
    try { alb = await this.album(v, art && art.id); } catch(e){}
    return { art, alb };
  },
  depuisCache(v){
    const art = this.cacheGet("a|" + normStr(v.artiste));
    const alb = v.titre ? this.cacheGet("b|" + normStr(v.artiste) + "|" + normStr(v.titre)) : null;
    if(art && (alb || !v.titre)) return { art, alb };
    return null;
  },

  reset(){
    const m = $("#detailModal"); if(!m) return;
    m.classList.remove("musee");
    ["--or","--or-clair","--or-dim","--or-soft","--musee-tint","--musee-tint2"].forEach(p => m.style.removeProperty(p));
    this.bio = null;
  },
  bind(){
    if(this._bound) return; this._bound = true;
    $("#detailModal").addEventListener("click", e => {
      const t = e.target.closest("[data-musee-act]"); if(!t) return;
      const a = t.dataset.museeAct;
      if(a === "bio") this.basculerBio(t);
      else if(a === "clip") this.lireClip(t.dataset.yt);
      else if(a === "savecover") this.enregistrerPochette(t.dataset.url);
      else if(a === "useyear") this.reprendreAnnee(t.dataset.year);
    });
  },

  enrich(v){
    this.bind();
    if(v.id !== this.lastId){ this.reset(); this.lastId = v.id; }
    if(!this.actif()){ this.reset(); return; }
    const my = ++this.token;
    const cache = v.artiste ? this.depuisCache(v) : { art:null, alb:null };
    if(cache){ this.apply(v, cache); return; }
    this.paletteDe(v, null);
    this.donnees(v).then(d => { if(my === this.token && State.detailId === v.id) this.apply(v, d); });
  },

  couper(txt, n){
    if(txt.length <= n) return txt;
    const cut = txt.slice(0, n);
    const idx = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("\n"));
    return idx > n * 0.5 ? cut.slice(0, idx + 1) : cut.trim() + "…";
  },
  fmt(txt){ return esc(txt).replace(/\r?\n+/g, "<br><br>"); },

  apply(v, d){
    const art = d.art && !d.art.none ? d.art : null;
    const alb = d.alb && !d.alb.none ? d.alb : null;
    const bg = $("#museeBg");
    if(bg && art && art.fanart.length){
      const url = art.fanart[this.hash(v.id) % art.fanart.length];
      const im = new Image();
      im.onload = () => { const el = $("#museeBg"); if(el && this.lastId === v.id){ el.style.backgroundImage = `url("${url.replace(/"/g, "%22")}")`; el.classList.add("on"); } };
      im.src = url;
    }
    const lg = $("#museeLogo");
    if(lg && art && art.logo) lg.innerHTML = `<img src="${esc(art.logo)}" alt="${esc(art.nom)}" onerror="this.remove()">`;
    const box = $("#museeBox");
    if(box){
      const parts = [];
      if(art && art.bio){
        this.bio = { court: this.couper(art.bio, 520), long: art.bio, ouvert: false };
        parts.push(`<div class="musee-bio"><div class="musee-h">L'artiste${art.bioLang === "en" ? " · texte en anglais" : ""}</div>
          <p id="museeBioTxt">${this.fmt(this.bio.court)}</p>
          ${art.bio.length > this.bio.court.length ? `<button type="button" class="musee-link" data-musee-act="bio">Lire la suite</button>` : ""}</div>`);
      }
      if(alb && alb.clip && /^[\w-]{11}$/.test(alb.clip.id)){
        const id = alb.clip.id;
        parts.push(`<div class="musee-clip"><div class="musee-h">Clip ${alb.clip.source === "artiste" ? "de l'artiste" : "de l'album"}${alb.clip.titre ? " · " + esc(alb.clip.titre) : ""}</div>
          <div class="musee-video" id="museeVideo" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')">
            <button type="button" class="musee-play" data-musee-act="clip" data-yt="${id}" aria-label="Lire le clip">▶</button>
          </div>
          <div class="musee-meta"><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Ouvrir sur YouTube ↗</a></div></div>`);
      }
      if(alb && /^\d{4}$/.test(String(alb.annee || ""))){
        parts.push(`<div class="musee-meta">Première sortie de l'album : <strong>${esc(alb.annee)}</strong> (TheAudioDB). Ce n'est pas toujours l'année d'enregistrement.
          ${!v.annee_enregistrement ? `<button type="button" class="musee-link" data-musee-act="useyear" data-year="${esc(alb.annee)}">Reprendre dans « Année d'enregistrement »</button>` : ""}</div>`);
      }
      if(parts.length){ box.className = "musee-box"; box.innerHTML = parts.join(""); }
    }
    if(!v.image_pochette && alb && alb.thumb && /^https?:\/\//.test(alb.thumb)){
      const fc = $(".fiche-cover");
      if(fc){
        fc.innerHTML = `<img src="${esc(alb.thumb)}" alt="Pochette (TheAudioDB)">`;
        fc.insertAdjacentHTML("afterend", `<button type="button" class="btn sm ghost" data-musee-act="savecover" data-url="${esc(alb.thumb)}" style="width:100%;margin-top:8px">Enregistrer cette pochette dans la fiche</button>`);
      }
    }
    this.paletteDe(v, alb && alb.thumb);
  },

  basculerBio(btn){
    if(!this.bio) return;
    this.bio.ouvert = !this.bio.ouvert;
    const p = $("#museeBioTxt"); if(p) p.innerHTML = this.fmt(this.bio.ouvert ? this.bio.long : this.bio.court);
    btn.textContent = this.bio.ouvert ? "Réduire" : "Lire la suite";
  },
  lireClip(id){
    if(!/^[\w-]{11}$/.test(id || "")) return;
    const box = $("#museeVideo"); if(!box) return;
    box.style.backgroundImage = "none";
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Clip" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  },
  async enregistrerPochette(url){
    const v = State.vinyles.find(x => x.id === State.detailId); if(!v || !/^https?:\/\//.test(url || "")) return;
    v.image_pochette = url; v.date_modif = new Date().toISOString();
    try { await Store.put(v); App.refresh(false); renderDetail(v); toast("Pochette enregistrée", v.titre); }
    catch(e){ toast("Erreur", e.message, true); }
  },
  async reprendreAnnee(an){
    const v = State.vinyles.find(x => x.id === State.detailId); if(!v || !/^\d{4}$/.test(an || "")) return;
    v.annee_enregistrement = Number(an); v.date_modif = new Date().toISOString();
    try { await Store.put(v); App.refresh(false); renderDetail(v); toast("Année d'enregistrement", `${v.titre} → ${an}`); }
    catch(e){ toast("Erreur", e.message, true); }
  },

  hsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dl = mx - mn;
    if(dl === 0) return [0, 0, l];
    const sat = dl / (1 - Math.abs(2 * l - 1));
    let h = mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
    h = Math.round(h * 60); if(h < 0) h += 360;
    return [h, sat, l];
  },
  extraire(d){
    const buckets = new Map();
    for(let i = 0; i < d.length; i += 4){
      if(d[i + 3] < 200) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2], hsl = this.hsl(r, g, b);
      if(hsl[2] < 0.10 || hsl[2] > 0.92) continue;
      const k = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      const e = buckets.get(k) || { n:0, r:0, g:0, b:0, s:0 };
      e.n++; e.r += r; e.g += g; e.b += b; e.s += hsl[1]; buckets.set(k, e);
    }
    const arr = [...buckets.values()].map(e => ({ r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n, s: e.s / e.n }));
    arr.forEach(e => { e.score = e.n * (0.25 + e.s); });
    arr.sort((a, b) => b.score - a.score);
    if(!arr.length) return null;
    const dist = (a, b) => Math.hypot(a.r - b.r, a.g - b.g, a.b - b.b);
    const p1 = arr[0], p2 = arr.find(e => dist(e, p1) > 90) || p1;
    return { p1: [p1.r, p1.g, p1.b].map(Math.round), p2: [p2.r, p2.g, p2.b].map(Math.round) };
  },
  palette(src){
    return new Promise(res => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const W = 48, c = document.createElement("canvas"); c.width = c.height = W;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(img, 0, 0, W, W);
          res(this.extraire(x.getImageData(0, 0, W, W).data));
        } catch(e){ res(null); }
      };
      img.onerror = () => res(null);
      img.src = src;
    });
  },
  async paletteDe(v, secours){
    const sources = [v.image_pochette, secours].filter((x, i, a) => x && a.indexOf(x) === i);
    for(const src of sources){
      let p = this.pal.get(src);
      if(p === undefined){ p = await this.palette(src); this.pal.set(src, p); }
      if(this.lastId !== v.id) return;
      if(p){ this.appliquerPalette(p); return; }
    }
  },
  appliquerPalette(p){
    const m = $("#detailModal"); if(!m) return;
    const h1 = this.hsl(...p.p1), h2 = this.hsl(...p.p2);
    if(h1[1] < 0.15) return;
    const s = Math.min(0.85, Math.max(0.35, h1[1])), H = h1[0];
    const H2 = h2[1] < 0.15 ? H : h2[0];
    m.classList.add("musee");
    m.style.setProperty("--or", `hsl(${H}, ${Math.round(s * 100)}%, 64%)`);
    m.style.setProperty("--or-clair", `hsl(${H}, ${Math.round(Math.min(s, 0.7) * 100)}%, 77%)`);
    m.style.setProperty("--or-dim", `hsla(${H}, ${Math.round(s * 100)}%, 64%, .24)`);
    m.style.setProperty("--or-soft", `hsla(${H}, ${Math.round(s * 100)}%, 64%, .10)`);
    m.style.setProperty("--musee-tint", `hsl(${H}, ${Math.round(Math.min(s, 0.6) * 55)}%, 13%)`);
    m.style.setProperty("--musee-tint2", `hsl(${H2}, ${Math.round(Math.min(s, 0.6) * 40)}%, 9%)`);
  }
};

/* ─── Caches TheAudioDB + normalisation ─── */
const AUDIODB_CACHE_KEY = "vinylArchiveJacques.cacheAudioDB";
const AUDIODB_TTL = 30 * 24 * 3600 * 1000;
function audiodbCacheGet(k){ try { const c = JSON.parse(localStorage.getItem(AUDIODB_CACHE_KEY) || "{}"); const e = c[k]; return e && (Date.now() - e.t) < AUDIODB_TTL ? e.r : null; } catch(e){ return null; } }
function audiodbCacheSet(k, r){ try { const c = JSON.parse(localStorage.getItem(AUDIODB_CACHE_KEY) || "{}"); c[k] = { t: Date.now(), r }; localStorage.setItem(AUDIODB_CACHE_KEY, JSON.stringify(c)); } catch(e){} }
async function audiodbFetch(v){
  if(!v.artiste) throw new Error("Artiste requis pour TheAudioDB");
  const cacheKey = normStr(v.artiste) + "|" + normStr(v.titre);
  const cached = audiodbCacheGet(cacheKey);
  if(cached) return cached;
  const r = await audiodbFetchRaw(v);
  audiodbCacheSet(cacheKey, r);
  return r;
}
async function audiodbFetchRaw(v){
  const key = (Settings.data.audiodbKey || "2").trim() || "2";
  const params = new URLSearchParams({ s: v.artiste });
  if(v.titre) params.set("a", v.titre);
  const res = await fetch(`https://www.theaudiodb.com/api/v1/json/${encodeURIComponent(key)}/searchalbum.php?` + params.toString());
  if(!res.ok){
    if(res.status === 429) throw new Error("Quota TheAudioDB atteint (429)");
    throw new Error("TheAudioDB HTTP " + res.status);
  }
  const json = await res.json();
  const albums = (json && json.album) || [];
  if(!albums.length) throw new Error("Aucune correspondance TheAudioDB");
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)|\[.*?\]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const tTitre = norm(v.titre);
  let best = albums[0], bestScore = -1;
  for(const a of albums){
    const n = norm(a.strAlbum);
    let score = 0;
    if(tTitre && n === tTitre) score += 5;
    else if(tTitre && (n.includes(tTitre) || tTitre.includes(n))) score += 3;
    if(v.annee_impression && String(a.intYearReleased) === String(v.annee_impression)) score += 1;
    if(a.strAlbumThumb) score += 0.5;
    if(score > bestScore){ bestScore = score; best = a; }
  }
  const bits = [best.strArtist, best.strAlbum].filter(Boolean).join(" – ");
  const extra = [best.intYearReleased, best.strGenre || best.strStyle, best.strLabel].filter(Boolean).join(" · ");
  return {
    label: bits + (extra ? " (" + extra + ")" : ""),
    cover: best.strAlbumThumbHQ || best.strAlbumThumb || null,
    url: best.idAlbum ? "https://www.theaudiodb.com/album/" + best.idAlbum : "https://www.theaudiodb.com/",
    idAlbum: best.idAlbum || null, idArtist: best.idArtist || null, annee: best.intYearReleased || null
  };
}

/* ─── Hook : brancher Rare au bouton + Musee à renderDetail ─── */
(function(){
  function brancher(){
    if(typeof App === "undefined" || typeof State === "undefined"){ setTimeout(brancher, 200); return; }
    if(window.__rareMuseeBranches) return;
    window.__rareMuseeBranches = true;

    /* Bouton ◆ Éditions rares */
    const btnRare = document.getElementById("btnRare");
    if(btnRare) btnRare.addEventListener("click", () => Rare.open());

    /* Overlay : clic hors modale ferme */
    const ov = document.getElementById("rareOverlay");
    if(ov) ov.addEventListener("mousedown", e => { if(e.target === ov) Rare.close(); });

    /* Échap ferme la modale Éditions rares */
    document.addEventListener("keydown", e => {
      if(e.key === "Escape" && ov && ov.classList.contains("open")) Rare.close();
    });

    /* Musee : s'enrichit après chaque renderDetail */
    const origRenderDetail = window.renderDetail;
    window.renderDetail = function(v){
      origRenderDetail(v);
      try { Musee.enrich(v); } catch(err){ console.warn("Musée :", err); }
    };

    console.log("%c◆ Éditions rares + Musée activés", "color:#C9A86A;font-weight:bold");
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", brancher);
  else brancher();
})();

VVVVVVVVVVVVV";
  const TEXTE_SECOURS = "Bienvenue dans Vinyl Archive, édition Jacques. Votre collection vous attend.";

  const page        = document.getElementById("welcomePage");
  const btnEnter    = document.getElementById("welcomeEnter");
  const btnSkip     = document.getElementById("welcomeSkip");
  const audioStatus = document.getElementById("audioStatus");
  if(!page) return;

  const sourceNettoyee = String(VOICE_DATA_URI || "")
    .replace(/\s+/g, "")
    .replace(/^["']|["']$/g, "");

   const isBase64   = sourceNettoyee.indexOf("data:audio") === 0;
  const isURL      = /^https?:\/\//i.test(sourceNettoyee);
  const isRelative = /^[a-zA-Z0-9._\/-]+\.(mp3|ogg|wav|m4a)(\?.*)?$/i.test(sourceNettoyee);
  const sourceValide = sourceNettoyee !== "" &&
                       sourceNettoyee !== "COLLEZ_VOTRE_BASE64_ICI" &&
                       (isBase64 || isURL || isRelative);

  const audioEl = new Audio();
  audioEl.preload = "auto";
  audioEl.volume = 1.0;

  if(sourceValide){
    audioEl.src = sourceNettoyee;
    audioEl.load();
    console.log(
      "%c♪ Source audio détectée : " +
      (isBase64
        ? "base64 (" + sourceNettoyee.length + " caractères)"
        : "URL distante → " + sourceNettoyee.substring(0, 60)),
      "color:#C9A86A;font-weight:bold"
    );
  } else {
    console.log(
      "%c⚠ Aucune source audio valide — la voix de synthèse sera utilisée",
      "color:#C9A86A;font-weight:bold"
    );
  }

  audioEl.addEventListener("play", () => {
    if(audioStatus){
      audioStatus.textContent = "Voix d'accueil en cours…";
      audioStatus.classList.add("playing");
    }
  });
  audioEl.addEventListener("ended", () => {
    if(audioStatus){
      audioStatus.textContent = "";
      audioStatus.classList.remove("playing");
    }
  });
  audioEl.addEventListener("error", e => {
    console.warn("Erreur de lecture audio — repli sur voix de synthèse", e);
    lancerVoixSynthese();
  });

  function lancerVoixSynthese(){
    if(!("speechSynthesis" in window)){
      if(audioStatus) audioStatus.textContent = "Aucune voix disponible";
      return;
    }
    try {
      const msg = new SpeechSynthesisUtterance(TEXTE_SECOURS);
      msg.lang = "fr-FR";
      msg.rate = 0.95;
      msg.pitch = 1.0;
      msg.volume = 1.0;
      const voix = window.speechSynthesis.getVoices()
        .find(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
      if(voix) msg.voice = voix;

      if(audioStatus){
        audioStatus.textContent = "Voix de synthèse";
        audioStatus.classList.add("playing");
      }
      msg.onend = () => {
        if(audioStatus){
          audioStatus.textContent = "";
          audioStatus.classList.remove("playing");
        }
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    } catch(e){
      console.warn("Synthèse vocale indisponible :", e);
    }
  }

  function lancerVoix(){
    if(!sourceValide){
      lancerVoixSynthese();
      return;
    }
    try { audioEl.currentTime = 0; } catch(e){}
    const promesse = audioEl.play();
    if(promesse && promesse.catch){
      promesse.catch(err => {
        console.warn("Lecture audio bloquée par le navigateur :", err.message);
        lancerVoixSynthese();
      });
    }
  }

  function dismiss(){
    try { audioEl.pause(); } catch(e){}
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    page.classList.add("hide");
    page.setAttribute("aria-hidden", "true");
    setTimeout(() => {
      const s = document.getElementById("globalSearch");
      if(s) s.focus();
    }, 500);
  }

  btnEnter?.addEventListener("click", () => {
    lancerVoix();
    if(sourceValide && isFinite(audioEl.duration) && audioEl.duration > 0){
      const duree = audioEl.duration * 1000;
      setTimeout(dismiss, Math.min(duree + 400, 12000));
    } else {
      setTimeout(dismiss, 3500);
    }
  });

  btnSkip?.addEventListener("click", dismiss);

  document.addEventListener("keydown", e => {
    if(page.classList.contains("hide")) return;
    if(e.key === "Enter"){ e.preventDefault(); btnEnter?.click(); }
    if(e.key === "Escape"){ dismiss(); }
  });

  window.showWelcome = () => {
    page.classList.remove("hide");
    page.setAttribute("aria-hidden", "false");
  };
})();

                <h3 class="help-section-title"><span>${s.icon}</span>${s.title}</h3>
                ${s.content}
              </section>
            `).join("")}
          </div>
        </div>
        <div class="help-footer">
          <span>Astuce : appuyez sur <kbd>H</kbd> pour ouvrir ce mode d'emploi à tout moment.</span>
          <span class="help-version">v1.3 — Jacques Edition</span>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const style = document.createElement("style");
    style.textContent = `
      .help-overlay{
        position:fixed; inset:0; z-index:900;
        background:rgba(6,6,6,.92);
        backdrop-filter:blur(12px);
        display:none;
        padding:32px 20px;
        overflow-y:auto;
      }
      .help-overlay.open{ display:block; animation:helpFade .3s ease; }
      @keyframes helpFade{ from{opacity:0} to{opacity:1} }

      .help-modal{
        max-width:1100px; margin:0 auto;
        background:linear-gradient(170deg,#151515 0%,#0f0f0f 100%);
        border:1px solid rgba(201,168,106,.28);
        border-radius:5px;
        box-shadow:0 24px 60px rgba(0,0,0,.75);
        display:flex; flex-direction:column;
        max-height:calc(100vh - 64px);
        animation:helpIn .35s cubic-bezier(.2,.8,.3,1);
      }
      @keyframes helpIn{
        from{ opacity:0; transform:translateY(20px) scale(.98); }
        to{ opacity:1; transform:none; }
      }

      .help-header{
        display:flex; align-items:center; justify-content:space-between;
        gap:20px; padding:22px 30px 18px;
        border-bottom:1px solid rgba(201,168,106,.16);
        flex-shrink:0;
      }
      .help-header h2{
        font-family:'Playfair Display',Georgia,serif;
        font-size:24px; color:var(--creme); font-weight:500;
      }
      .help-sub{
        font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
        color:var(--or); margin-top:5px; font-weight:500;
      }

      .help-body{
        display:grid; grid-template-columns:250px 1fr;
        flex:1; min-height:0; overflow:hidden;
      }

      .help-nav{
        border-right:1px solid rgba(201,168,106,.14);
        padding:16px 12px;
        overflow-y:auto;
        display:flex; flex-direction:column; gap:2px;
        background:rgba(0,0,0,.18);
      }
      .help-nav-btn{
        display:flex; align-items:center; gap:12px;
        width:100%; text-align:left;
        padding:11px 14px;
        border-radius:3px;
        font-family:'Inter',sans-serif;
        font-size:12.5px; letter-spacing:.03em;
        color:var(--creme-dim);
        background:transparent;
        border:none; cursor:pointer;
        transition:.2s;
        line-height:1.3;
      }
      .help-nav-btn:hover{
        background:rgba(201,168,106,.07);
        color:var(--or-clair);
      }
      .help-nav-btn.active{
        background:linear-gradient(90deg,rgba(201,168,106,.15),rgba(201,168,106,.04));
        color:var(--or-clair);
        font-weight:500;
        border-left:2px solid var(--or);
        padding-left:12px;
      }
      .help-nav-icon{
        font-size:13px; width:16px; text-align:center;
        opacity:.85; flex-shrink:0;
      }

      .help-content{
        padding:26px 34px 34px;
        overflow-y:auto;
      }
      .help-section{ display:none; }
      .help-section.active{ display:block; animation:helpSlide .3s ease; }
      @keyframes helpSlide{
        from{ opacity:0; transform:translateX(12px); }
        to{ opacity:1; transform:none; }
      }

      .help-section-title{
        font-family:'Playfair Display',Georgia,serif;
        font-size:22px; color:var(--or); font-weight:500;
        margin-bottom:18px; padding-bottom:12px;
        border-bottom:1px solid rgba(201,168,106,.2);
        display:flex; align-items:center; gap:12px;
      }
      .help-section-title span{ font-size:16px; opacity:.8; }

      .help-content p{
        color:var(--creme-dim);
        font-size:13.5px; line-height:1.75;
        margin-bottom:12px;
      }
      .help-content h3{
        font-family:'Playfair Display',Georgia,serif;
        font-size:15px; color:var(--or-clair); font-weight:500;
        margin:22px 0 10px;
        letter-spacing:.02em;
      }
      .help-content h3:first-of-type{ margin-top:0; }

      .help-content ul, .help-content ol{
        margin:0 0 14px 22px;
        color:var(--creme-dim);
        font-size:13.5px; line-height:1.75;
      }
      .help-content li{ margin-bottom:5px; }
      .help-content li strong{ color:var(--creme); font-weight:500; }

      .help-content a{
        color:var(--or);
        text-decoration:none;
        border-bottom:1px dotted rgba(201,168,106,.4);
        transition:.2s;
      }
      .help-content a:hover{ color:var(--or-clair); border-bottom-style:solid; }

      .help-content code{
        font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
        font-size:12px;
        background:rgba(201,168,106,.1);
        color:var(--or-clair);
        padding:2px 6px;
        border-radius:2px;
      }

      .help-content kbd{
        display:inline-block;
        font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
        font-size:11px;
        background:#080808;
        color:var(--or-clair);
        border:1px solid rgba(201,168,106,.32);
        border-bottom-width:2px;
        padding:2px 7px;
        border-radius:3px;
        margin:0 2px;
        min-width:22px; text-align:center;
      }

      .help-content .tip{
        background:linear-gradient(135deg,rgba(201,168,106,.09),rgba(201,168,106,.02));
        border-left:2px solid var(--or);
        padding:12px 16px;
        margin:14px 0;
        border-radius:0 3px 3px 0;
        font-size:13px;
        color:var(--creme-dim);
      }
      .help-content .hint{
        font-size:12px; color:var(--creme-faint); font-style:italic;
      }

      table.shortcuts{
        width:100%;
        border-collapse:collapse;
        margin:14px 0;
        font-size:13px;
      }
      table.shortcuts tr{
        border-bottom:1px solid rgba(201,168,106,.1);
      }
      table.shortcuts tr:last-child{ border-bottom:none; }
      table.shortcuts td{
        padding:11px 14px;
        color:var(--creme-dim);
      }
      table.shortcuts td:first-child{
        width:180px;
        white-space:nowrap;
      }

      .help-footer{
        display:flex; justify-content:space-between; align-items:center;
        padding:14px 30px;
        border-top:1px solid rgba(201,168,106,.14);
        font-size:11px;
        color:var(--creme-faint);
        letter-spacing:.03em;
        flex-shrink:0;
      }
      .help-version{ color:var(--or); letter-spacing:.14em; text-transform:uppercase; }

      @media (max-width:760px){
        .help-overlay{ padding:12px 8px; }
        .help-modal{ max-height:calc(100vh - 24px); }
        .help-header{ padding:16px 18px 14px; }
        .help-header h2{ font-size:19px; }
        .help-body{
          grid-template-columns:1fr;
          overflow-y:auto;
        }
        .help-nav{
          flex-direction:row;
          overflow-x:auto;
          overflow-y:hidden;
          padding:10px;
          border-right:none;
          border-bottom:1px solid rgba(201,168,106,.14);
          gap:6px;
          flex-shrink:0;
        }
        .help-nav-btn{
          width:auto;
          white-space:nowrap;
          padding:8px 12px;
          font-size:11.5px;
          flex-shrink:0;
        }
        .help-nav-btn.active{
          border-left:none;
          border-bottom:2px solid var(--or);
          padding-left:12px;
        }
        .help-content{ padding:20px 18px 26px; }
        .help-section-title{ font-size:18px; }
        .help-footer{
          padding:12px 18px;
          flex-direction:column;
          gap:6px;
          text-align:center;
        }
      }
    `;
    document.head.appendChild(style);

    function open(){
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function close(){
      overlay.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("helpClose").addEventListener("click", close);
        const helpBackBtn = document.getElementById("helpBack");
    if(helpBackBtn) helpBackBtn.addEventListener("click", close);
    overlay.addEventListener("mousedown", e => {
      if(e.target === overlay) close();
    });

    document.getElementById("helpNav").addEventListener("click", e => {
      const btn = e.target.closest(".help-nav-btn");
      if(!btn) return;
      const target = btn.dataset.target;
      document.querySelectorAll(".help-nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".help-section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      const section = document.getElementById("help-" + target);
      if(section){
        section.classList.add("active");
        document.getElementById("helpContent").scrollTop = 0;
      }
    });

       document.addEventListener("keydown", e => {
      if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      const welcome = document.getElementById("welcomePage");
      if(welcome && !welcome.classList.contains("hide")) return;
      if(e.key === "h" || e.key === "H"){
        if(!overlay.classList.contains("open")){
          e.preventDefault();
          open();
        }
      }
      if(e.key === "Escape" && overlay.classList.contains("open")){
        close();
      }
    });

    const topActions = document.querySelector(".top-actions");
    if(topActions && !document.getElementById("btnHelp")){
      const btn = document.createElement("button");
      btn.id = "btnHelp";
      btn.className = "btn ghost";
      btn.title = "Mode d'emploi (H)";
      btn.textContent = "?";
      btn.style.fontWeight = "600";
      btn.addEventListener("click", open);
      topActions.insertBefore(btn, topActions.firstChild);
    }

    window.openHelp = open;
    window.closeHelp = close;

    console.log("%c? Mode d'emploi disponible (bouton '?' ou touche H)", "color:#C9A86A;font-weight:bold");
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", initHelp);
  } else {
    initHelp();
  }
})();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(reg => console.log("%c✓ Service Worker actif — l'appli fonctionne hors ligne", "color:#C9A86A;font-weight:bold"))
      .catch(err => console.warn("Service Worker indisponible :", err));
  });
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   CORRECTIF IPAD v2 — Fermeture immédiate, voix préservée
   Utilise la phase "capture" pour fermer la page AVANT que le
   handler original ne s'exécute. La voix se lance normalement.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  function patchWelcome(){
    const page     = document.getElementById("welcomePage");
    const btnEnter = document.getElementById("welcomeEnter");
    const btnSkip  = document.getElementById("welcomeSkip");
    if(!page) return;

    /* ─── Bypass d'urgence via URL : ?skip=1 ─── */
    try {
      if(location.search.includes("skip=1")){
        page.classList.add("hide");
        page.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        return;
      }
    } catch(e){}

    let done = false;

    function closeIt(){
      if(done) return;
      done = true;
      try { page.classList.add("hide"); } catch(e){}
      try { page.setAttribute("aria-hidden", "true"); } catch(e){}
      try { document.body.style.overflow = ""; } catch(e){}
      setTimeout(() => {
        try {
          const s = document.getElementById("globalSearch");
          if(s && s.focus) s.focus();
        } catch(e){}
      }, 300);
    }

    /* Handler en phase CAPTURE : s'exécute AVANT l'original.
       Résultat : fermeture immédiate, puis l'original lance la voix. */
    function captureClose(){
      closeIt();
      /* on ne preventDefault PAS — l'original s'exécute ensuite */
    }

    if(btnEnter){
      btnEnter.addEventListener("click",    captureClose, { capture:true });
      btnEnter.addEventListener("touchend", captureClose, { capture:true, passive:true });
    }
    if(btnSkip){
      btnSkip.addEventListener("click",    captureClose, { capture:true });
      btnSkip.addEventListener("touchend", captureClose, { capture:true, passive:true });
    }

    /* Tap n'importe où sur la page → ferme aussi */
    try {
      page.addEventListener("click", e => {
        if(e.target === page || (e.target.classList && e.target.classList.contains("welcome-inner"))) closeIt();
      }, { capture:true });
    } catch(e){}

    /* Clavier (desktop) */
    document.addEventListener("keydown", e => {
      if(done) return;
      if(e.key === "Escape"){ e.preventDefault(); closeIt(); }
    });

    /* Filet de sécurité absolu : 15 s */
    setTimeout(() => {
      if(!done){
        console.warn("Page d'accueil : fermeture automatique (délai 15 s)");
        closeIt();
      }
    }, 15000);

    console.log("%c♪ Correctif iPad v2 actif (voix préservée)", "color:#C9A86A;font-weight:bold");
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", () => setTimeout(patchWelcome, 100));
  } else {
    setTimeout(patchWelcome, 100);
  }
})();
</script>
