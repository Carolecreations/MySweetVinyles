<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Archive – Jacques Edition</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinyl Archive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#0D0D0D; --creme:#F5F2E9; --or:#C9A86A; --or-clair:#E2C893;
  --anthracite:#2A2A2A; --brique:#A63A3A;
  --or-dim:rgba(201,168,106,.22); --or-soft:rgba(201,168,106,.10);
  --creme-dim:rgba(245,242,233,.55); --creme-faint:rgba(245,242,233,.32);
  --radius:4px; --shadow-lg:0 24px 60px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--noir); color:var(--creme);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px; line-height:1.55; min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 620px at 12% -12%, rgba(201,168,106,.075), transparent 62%),
    radial-gradient(900px 520px at 102% 2%, rgba(166,58,58,.055), transparent 58%),
    radial-gradient(800px 800px at 50% 120%, rgba(201,168,106,.03), transparent 60%);
}
::selection{background:var(--or); color:var(--noir)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:6px;border:2px solid #0a0a0a}
::-webkit-scrollbar-thumb:hover{background:var(--or-dim)}

h1,h2,h3,h4,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:500;letter-spacing:.005em}
.label-mini{font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--creme-faint);font-weight:500}

.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:26px; padding:14px 32px;
  background:rgba(13,13,13,.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--or-dim);
}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand-disc{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:
    radial-gradient(circle at 50% 50%, var(--or) 0 8%, transparent 8.5%),
    repeating-radial-gradient(circle at 50% 50%, #1c1c1c 0 1.5px, #101010 1.5px 3px), #111;
  border:1px solid var(--or-dim); position:relative; animation:spin 26s linear infinite;
  box-shadow:inset 0 0 14px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.6);
}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-disc::after{
  content:''; position:absolute; inset:32%; border-radius:50%;
  background:radial-gradient(circle at 40% 35%, var(--or-clair), var(--or) 55%, #8a6f3d);
  box-shadow:0 0 8px rgba(201,168,106,.4);
}
.brand-text h1{font-size:19px;line-height:1.1;letter-spacing:.02em}
.brand-text span{display:block;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--or);margin-top:2px;font-weight:500}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap input{
  width:100%; background:#0a0a0a; border:1px solid var(--or-dim); color:var(--creme);
  padding:11px 14px 11px 40px; border-radius:3px; font-family:inherit; font-size:13.5px; transition:.25s;
}
.search-wrap input::placeholder{color:var(--creme-faint)}
.search-wrap input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,168,106,.09);background:#0e0e0e}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.top-actions{display:flex;gap:10px;margin-left:auto;flex-shrink:0}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:3px;
  font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--or-dim);color:var(--creme);background:transparent;transition:.22s;white-space:nowrap;
}
.btn:hover{border-color:var(--or);color:var(--or-clair);background:var(--or-soft)}
.btn.primary{background:linear-gradient(135deg,var(--or) 0%,#B4934F 100%);color:#141008;border-color:transparent;font-weight:600}
.btn.primary:hover{background:linear-gradient(135deg,var(--or-clair) 0%,var(--or) 100%);color:#0d0d0d;box-shadow:0 6px 20px rgba(201,168,106,.28)}
.btn.ghost{border-color:transparent;color:var(--creme-dim);padding:10px 12px}
.btn.ghost:hover{color:var(--or);background:var(--or-soft)}
.btn.danger{border-color:rgba(166,58,58,.5);color:#d98c8c}
.btn.danger:hover{background:rgba(166,58,58,.16);border-color:var(--brique);color:#e8a5a5}
.btn.sm{padding:7px 13px;font-size:10px}

.controls{position:relative;z-index:1;padding:22px 32px 0;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.stats{display:flex;gap:34px;flex-wrap:wrap}
.stat .k{font-family:'Playfair Display',serif;font-size:26px;line-height:1;color:var(--or);letter-spacing:.01em}
.stat .k small{font-size:14px;opacity:.7;margin-left:2px}
.stat .v{margin-top:5px}
.toolbar{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.select-mini{background:#0a0a0a;border:1px solid var(--or-dim);color:var(--creme);padding:9px 12px;border-radius:3px;font-family:inherit;font-size:11.5px;letter-spacing:.05em;cursor:pointer;transition:.2s}
.select-mini:focus{outline:none;border-color:var(--or)}
.view-toggle{display:flex;border:1px solid var(--or-dim);border-radius:3px;overflow:hidden}
.view-toggle button{padding:9px 12px;font-size:13px;color:var(--creme-faint);transition:.2s;line-height:1}
.view-toggle button.on{background:var(--or-soft);color:var(--or)}

.filters-panel{position:relative;z-index:1;margin:18px 32px 0;border:1px solid var(--or-dim);border-radius:var(--radius);background:linear-gradient(180deg,#131313,#0f0f0f);overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s ease,margin .3s}
.filters-panel.open{max-height:900px;opacity:1}
.filters-inner{padding:24px 26px}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:'Playfair Display',Georgia,serif;font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--or);font-weight:500;opacity:.82}
.field input,.field select,.field textarea{width:100%;background:linear-gradient(180deg,#090909,#0c0c0c);border:1px solid rgba(201,168,106,.22);color:var(--creme);padding:10px 13px;border-radius:3px;font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.02em;transition:.25s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,168,106,.10),inset 0 0 10px rgba(201,168,106,.05);background:#0e0e0e}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:rgba(245,242,233,.22);font-style:italic}
.field .checkbox-field{
  display:flex; align-items:center; gap:10px;
  padding:10px 13px; min-height:40px;
  background:#0a0a0a;
  border:1px solid rgba(201,168,106,.18);
  border-radius:3px;
  cursor:pointer;
  transition:.22s;
}
.field .checkbox-field:hover{
  border-color:rgba(201,168,106,.5);
  background:#0c0c0c;
}
.field .checkbox-field input[type=checkbox]{
  width:15px; height:15px; margin:0;
  accent-color:var(--or);
  cursor:pointer;
  flex-shrink:0;
}
.field .checkbox-field span{
  font-family:'Inter',sans-serif;
  font-size:12.5px !important;
  color:var(--creme-dim);
  letter-spacing:.02em;
  text-transform:none;
}
.filters-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid rgba(201,168,106,.14)}
.chip-count{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:13px;letter-spacing:.03em;color:var(--or-clair)}

.library{position:relative;z-index:1;padding:26px 32px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:24px}
.library.list-view{grid-template-columns:1fr;gap:10px}
.card{background:linear-gradient(165deg,#171717 0%,#101010 100%);border:1px solid rgba(201,168,106,.13);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .3s,box-shadow .35s;box-shadow:0 6px 18px rgba(0,0,0,.5);position:relative;animation:cardIn .4s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);border-color:rgba(201,168,106,.48);box-shadow:0 18px 40px rgba(0,0,0,.68),0 0 0 1px rgba(201,168,106,.1)}
.cover{position:relative;aspect-ratio:1/1;background:#0a0a0a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .cover img{transform:scale(1.045)}
.cover-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%, #1e1e1e 0%, #0d0d0d 70%),repeating-linear-gradient(45deg,rgba(201,168,106,.03) 0 2px,transparent 2px 8px)}
.cover-empty span{font-family:'Playfair Display',serif;font-size:44px;color:rgba(201,168,106,.32);font-style:italic}
.badge{position:absolute;top:9px;left:9px;background:rgba(13,13,13,.85);border:1px solid var(--or-dim);color:var(--or);font-size:9px;font-weight:600;letter-spacing:.14em;padding:4px 8px;border-radius:2px;text-transform:uppercase;backdrop-filter:blur(4px)}
.badge.rar{left:auto;right:9px;border-color:rgba(166,58,58,.55);color:#d98c8c;background:rgba(30,10,10,.85)}
.badge.loc{
  top:auto; bottom:9px; left:9px;
  border-color:rgba(201,168,106,.4);
  color:var(--or-clair);
  background:rgba(10,10,10,.9);
  max-width:calc(100% - 18px);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
  .badge.pret{
  top:auto; bottom:9px; right:9px; left:auto;
  border-color:rgba(201,168,106,.6);
  color:#141008;
  background:linear-gradient(135deg,#E2C893,#C9A86A);
  font-weight:700;
}
.library.list-view .badge.loc{display:inline-flex}
  .card-body{padding:13px 15px 11px}
.card-title{font-family:'Playfair Display',serif;font-size:15px;line-height:1.28;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.card-artist{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--or);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{margin-top:9px;font-size:10.5px;color:var(--creme-faint);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta i{font-style:normal;opacity:.4}
.card-foot{display:flex;justify-content:space-between;align-items:center;padding:9px 15px;border-top:1px solid rgba(201,168,106,.11);background:rgba(0,0,0,.22)}
.card-value{font-family:'Playfair Display',serif;font-size:14.5px;color:var(--or-clair)}
.card-value.none{font-size:11px;color:var(--creme-faint);font-family:'Inter',sans-serif}
.state-tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid rgba(245,242,233,.14);color:var(--creme-dim)}
.state-tag.good{border-color:rgba(201,168,106,.4);color:var(--or)}
.state-tag.mid{border-color:rgba(245,242,233,.2);color:var(--creme-dim)}
.state-tag.bad{border-color:rgba(166,58,58,.45);color:#cf8b8b}
.library.list-view .card{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:0}
.library.list-view .cover{aspect-ratio:1;height:76px}
.library.list-view .cover-empty span{font-size:26px}
.library.list-view .badge{display:none}
.library.list-view .card-body{padding:10px 18px}
.library.list-view .card-title{min-height:0;font-size:15px;-webkit-line-clamp:1}
.library.list-view .card-foot{border-top:none;border-left:1px solid rgba(201,168,106,.11);padding:10px 20px;background:transparent;gap:16px;height:100%}

.empty{grid-column:1/-1;text-align:center;padding:90px 20px;color:var(--creme-faint)}
.empty .big{font-family:'Playfair Display',serif;font-size:30px;color:var(--creme-dim);margin-bottom:12px;font-style:italic}
.empty p{font-size:13px;max-width:440px;margin:0 auto 24px;line-height:1.7}
.empty-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(6,6,6,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;padding:44px 20px;display:none}
.overlay.open{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{max-width:1080px;margin:0 auto;background:linear-gradient(170deg,#151515 0%,#0f0f0f 100%);border:1px solid rgba(201,168,106,.28);border-radius:5px;box-shadow:var(--shadow-lg);position:relative;animation:modalIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.modal.narrow{max-width:620px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:26px 32px 20px;border-bottom:1px solid rgba(201,168,106,.16);position:sticky;top:0;background:rgba(17,17,17,.96);backdrop-filter:blur(10px);z-index:5;border-radius:5px 5px 0 0}
.modal-head h2{font-size:23px;line-height:1.22}
.modal-head .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);margin-top:6px;font-weight:500}
.close-x{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--or-dim);color:var(--creme-dim);font-size:17px;transition:.22s;line-height:1}
.btn-back{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:3px;
  border:1px solid var(--or-dim);
  color:var(--creme-dim); background:transparent;
  font-family:'Inter',sans-serif;
  font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase;
  cursor:pointer; transition:.2s; white-space:nowrap;
  line-height:1;
}
.btn-back:hover{ border-color:var(--or); color:var(--or-clair); background:var(--or-soft); }
.btn-back .arrow{ font-size:14px; line-height:1; display:inline-block; transform:translateY(-1px); }
  .close-x:hover{border-color:var(--brique);color:#e8a5a5;background:rgba(166,58,58,.14);transform:rotate(90deg)}

.fiche-body{padding:30px 32px 36px}
.fiche-cols{display:grid;grid-template-columns:290px 1fr;gap:40px}
.fiche-media{position:sticky;top:110px;align-self:start}
.fiche-cover{width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;border:1px solid rgba(201,168,106,.24);background:#0a0a0a;box-shadow:0 16px 40px rgba(0,0,0,.65);position:relative}
.fiche-cover img{width:100%;height:100%;object-fit:cover;display:block}
.fiche-cover .cover-empty span{font-size:72px}
.fiche-vinyl-mini{margin-top:14px;width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;border:1px solid rgba(201,168,106,.14);background:#0a0a0a}
.fiche-vinyl-mini img{width:100%;height:100%;object-fit:cover}
.fiche-value-box{margin-top:20px;padding:18px;border:1px solid var(--or-dim);border-radius:3px;background:linear-gradient(160deg,rgba(201,168,106,.07),rgba(201,168,106,.015));text-align:center}
.fiche-value-box .amt{font-family:'Playfair Display',serif;font-size:31px;color:var(--or-clair);line-height:1;margin:8px 0 4px}
.fiche-value-box .amt small{font-size:16px;opacity:.75;margin-left:3px}
.fiche-value-box .split{display:flex;justify-content:center;gap:22px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(201,168,106,.16);font-size:11px;color:var(--creme-dim)}
.fiche-value-box .split b{display:block;color:var(--creme);font-weight:500;font-size:12.5px;margin-top:2px}

.section{margin-bottom:26px}
.section-title{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:14px;color:var(--or);letter-spacing:.05em;margin-bottom:14px}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,106,.35),transparent)}
.section-title .ico{font-size:11px;opacity:.8}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 26px}
.data-item{border-bottom:1px solid rgba(245,242,233,.06);padding-bottom:9px}
.data-item .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--creme-faint);font-weight:500;margin-bottom:4px}
.data-item .v{font-size:13.5px;color:var(--creme);word-break:break-word}
.data-item .v.muted{color:var(--creme-faint);font-style:italic;font-size:12.5px}
.data-item .v.gold{color:var(--or-clair)}
.notes-block{background:rgba(0,0,0,.28);border-left:2px solid var(--or-dim);padding:14px 18px;border-radius:0 3px 3px 0;font-size:13px;color:var(--creme-dim);line-height:1.7;white-space:pre-wrap}
.particularites-tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:10.5px;letter-spacing:.06em;padding:4px 10px;border-radius:2px;background:rgba(201,168,106,.09);border:1px solid rgba(201,168,106,.24);color:var(--or-clair)}

.price-engine{margin-top:20px;border:1px solid rgba(201,168,106,.2);border-radius:3px;background:rgba(0,0,0,.3);overflow:hidden}
.price-engine-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;border-bottom:1px solid rgba(201,168,106,.14);background:rgba(201,168,106,.045)}
.price-engine-head .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.price-sources{padding:6px 0}
.psrc{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 18px;font-size:12.5px;border-bottom:1px solid rgba(245,242,233,.05)}
.psrc:last-child{border-bottom:none}
.psrc .name{display:flex;align-items:center;gap:10px;color:var(--creme-dim)}
.psrc .dot{width:6px;height:6px;border-radius:50%;background:var(--creme-faint);flex-shrink:0}
.psrc .dot.ok{background:var(--or);box-shadow:0 0 7px rgba(201,168,106,.65)}
.psrc .dot.err{background:var(--brique)}
.psrc .dot.load{background:var(--or);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.psrc .val{font-family:'Playfair Display',serif;font-size:15px;color:var(--or-clair)}
.psrc a{color:var(--or);text-decoration:none;font-size:11px;border-bottom:1px dotted var(--or-dim)}
.psrc a:hover{color:var(--or-clair)}

.form-body{padding:26px 32px 32px}
.form-section{margin-bottom:30px}
.form-section > .section-title{margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 20px}
.form-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:22px;border-top:1px solid rgba(201,168,106,.16);flex-wrap:wrap}
.form-actions .right{display:flex;gap:12px;flex-wrap:wrap}

.img-picker{display:flex;gap:14px;align-items:flex-start}
.img-preview{width:118px;height:118px;flex-shrink:0;border-radius:3px;overflow:hidden;border:1px dashed rgba(201,168,106,.32);background:#0a0a0a;display:flex;align-items:center;justify-content:center;color:var(--creme-faint);font-size:10px;text-align:center;position:relative}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-preview .ph{padding:8px;line-height:1.4;letter-spacing:.08em}
.img-controls{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.img-controls .row{display:flex;gap:9px;flex-wrap:wrap}

.hint{font-size:11px;color:var(--creme-faint);line-height:1.6}

code,pre{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

/* ═══ TABLEAU DE BORD ═══ */
.dashboard-panel{
  position:relative; z-index:1;
  margin:0 32px;
  border:1px solid var(--or-dim);
  border-radius:var(--radius);
  background:linear-gradient(180deg,#131313,#0f0f0f);
  overflow:hidden;
  max-height:0; opacity:0;
  transition:max-height .55s ease, opacity .35s ease, margin .35s ease;
}
.dashboard-panel.open{
  max-height:2400px; opacity:1;
  margin:18px 32px 0;
}
.dashboard-inner{ padding:22px; }
.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

.dash-card{
  background:rgba(0,0,0,.28);
  border:1px solid rgba(201,168,106,.13);
  border-radius:3px;
  padding:16px 18px;
  min-height:210px;
}
.dash-title{
  font-family:'Playfair Display',serif;
  font-size:13px; color:var(--or);
  letter-spacing:.04em;
  margin-bottom:14px; padding-bottom:8px;
  border-bottom:1px solid rgba(201,168,106,.14);
}
.dash-empty{
  color:var(--creme-faint);
  font-size:12px; font-style:italic;
  text-align:center; padding:40px 0;
}

.dash-bar-row{
  display:grid;
  grid-template-columns:78px 1fr 38px;
  gap:10px; align-items:center;
  margin-bottom:9px;
}
.dash-bar-label{
  color:var(--creme-dim);
  text-transform:uppercase;
  letter-spacing:.08em; font-size:10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dash-bar-track{
  background:rgba(201,168,106,.08);
  height:8px; border-radius:4px; overflow:hidden;
}
.dash-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--or),var(--or-clair));
  border-radius:4px;
  transition:width .9s cubic-bezier(.2,.8,.3,1);
}
.dash-bar-value{
  text-align:right;
  color:var(--or-clair);
  font-family:'Playfair Display',serif;
  font-size:13px;
}

.dash-vbars{
  display:flex;
  align-items:flex-end;
  justify-content:space-around;
  height:160px; gap:8px;
  padding-top:24px;
}
.dash-vbar{
  flex:1; height:100%;
  display:flex; flex-direction:column;
  align-items:center; gap:6px;
}
.dash-vbar-track{
  width:100%; flex:1;
  display:flex; align-items:flex-end;
  justify-content:center;
}
.dash-vbar-fill{
  width:72%; min-height:4px;
  background:linear-gradient(180deg,var(--or-clair),var(--or));
  border-radius:3px 3px 0 0;
  position:relative;
  transition:height .9s cubic-bezier(.2,.8,.3,1);
}
.dash-vbar-value{
  position:absolute; top:-17px; left:50%;
  transform:translateX(-50%);
  font-size:9.5px; white-space:nowrap;
  color:var(--or-clair);
  font-family:'Playfair Display',serif;
}
.dash-vbar-label{
  font-size:9px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--creme-faint);
}

.dash-donut-wrap{
  display:flex; gap:16px; align-items:center;
}
.dash-donut{
  width:132px; height:132px; flex-shrink:0;
}
.dash-legend{
  flex:1; min-width:0;
  display:flex; flex-direction:column; gap:7px;
}
.dash-legend-item{
  display:flex; align-items:center; gap:8px;
  font-size:11.5px;
}
.dash-legend-dot{
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.dash-legend-label{
  flex:1; color:var(--creme-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dash-legend-count{
  color:var(--or-clair); font-weight:500;
}

@media (max-width:760px){
  .dashboard-panel{ margin:0 18px; }
  .dashboard-panel.open{ margin:14px 18px 0; }
  .dashboard-inner{ padding:16px; }
  .dash-card{ padding:14px; min-height:auto; }
  .dash-donut-wrap{ flex-direction:column; gap:12px; }
}
/* ═══ Page de présentation — Jacques Edition ═══ */
.welcome-page{

const Store = (() => {
  const DB_NAME = "VinylArchiveJacques", DB_VER = 1, STORE = "vinyles";
  const LS_KEY = "vinylArchiveJacques.vinyles";
  let db = null, mode = "idb";
  function openIDB(){
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch(e){ return reject(e); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          const os = d.createObjectStore(STORE, { keyPath:"id" });
          os.createIndex("artiste", "artiste", { unique:false });
          os.createIndex("annee", "annee_impression", { unique:false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("IndexedDB bloquée"));
      setTimeout(() => reject(new Error("timeout")), 3500);
    });
  }
  async function init(){
    try { db = await openIDB(); mode = "idb"; }
    catch(e){ console.warn("IndexedDB indisponible, repli localStorage :", e); mode = "ls"; }
    return mode;
  }
  function tx(m, fn){
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, m), os = t.objectStore(STORE);
      let r; try { r = fn(os); } catch(e){ return reject(e); }
      t.oncomplete = () => resolve(r && r.__req ? r.__req.result : r);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  function lsAll(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch(e){ return []; } }
  function lsSave(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
  return {
    init,
    get mode(){ return mode; },
    async getAll(){ if(mode === "ls") return lsAll(); return tx("readonly", os => { const req = os.getAll(); return { __req: req }; }); },
    async put(item){
      if(mode === "ls"){ const all = lsAll(); const i = all.findIndex(x => x.id === item.id); if(i >= 0) all[i] = item; else all.push(item); lsSave(all); return item; }
      return tx("readwrite", os => { os.put(item); return item; });
    },
    async putMany(items){
      if(mode === "ls"){ const all = lsAll(); items.forEach(item => { const i = all.findIndex(x => x.id === item.id); if(i >= 0) all[i] = item; else all.push(item); }); lsSave(all); return items.length; }
      return tx("readwrite", os => { items.forEach(it => os.put(it)); return items.length; });
    },
    async del(id){ if(mode === "ls"){ lsSave(lsAll().filter(x => x.id !== id)); return; } return tx("readwrite", os => { os.delete(id); }); },
    async clear(){ if(mode === "ls"){ lsSave([]); return; } return tx("readwrite", os => { os.clear(); }); }
  };
})();

function heuristicEstimate(v){
  const format = v.format || "33T";
  const genre  = (v.genre || "").toLowerCase();
  const BASE_FORMAT = { "33T":16, "45T":9, "78T":22, "Maxi":13, "Picture Disc":26, "Coffret":38, "10\"":15, "Autre":14 };
  let base = BASE_FORMAT[format] ?? 15;
   if(v.format_double)   base *= 1.55;
  if(v.format_triple)   base *= 2.10;
  if(v.format_gatefold) base *= 1.15;
  const GENRE_COEF = { "jazz":1.75, "classique":1.5, "rock":1.35, "blues":1.4, "soul":1.4, "funk":1.45, "disco":1.1, "pop":0.85, "variété":0.7, "chanson française":1.0, "électro":1.15, "reggae":1.2, "rap":1.2, "folk":1.15, "metal":1.25, "punk":1.3, "bossa nova":1.5, "bande originale":1.3, "gospel":1.3, "country":0.95, "musique du monde":1.1 };
  for(const k in GENRE_COEF){ if(genre.includes(k)){ base *= GENRE_COEF[k]; break; } }
  const an = num(v.annee_impression);
  if(an){ if(an < 1960) base *= 2.1; else if(an < 1970) base *= 1.7; else if(an < 1980) base *= 1.35; else if(an < 1990) base *= 1.05; else if(an < 2000) base *= 0.85; else base *= 1.0; }
  base *= COEF_PRESSAGE[v.pressage] ?? 1;
  base *= COEF_RARETE[v.rarete] ?? 1;
  base *= COEF_ETAT[v.etat_disque] ?? 1;
  base *= 0.55 + 0.45 * (COEF_ETAT[v.etat_pochette] ?? 1);
  return Math.max(1, Math.round(base * 100) / 100);
}

const GRADE_DISCOGS = { "Mint":"Mint (M)", "Near Mint":"Near Mint (NM or M-)", "VG+":"Very Good Plus (VG+)", "VG":"Very Good (VG)", "G":"Good (G)", "Poor":"Poor (P)" };
const TAUX_EUR = { EUR:1, USD:0.92, GBP:1.15 }; /* taux approximatifs, pour une estimation indicative */
async function discogsSuggest(releaseId, token, etat){
  const res = await fetch(`https://api.discogs.com/marketplace/price_suggestions/${releaseId}?token=${encodeURIComponent(token)}`, { headers:{ "User-Agent":"VinylArchiveJacques/1.0" } });
  if(!res.ok) throw new Error(res.status === 401 || res.status === 403 ? "réglages vendeur Discogs à renseigner" : "prix suggérés indisponibles (HTTP " + res.status + ")");
  const j = await res.json();
  let approx = false;
  const toEur = p => {
    if(!p || typeof p.value !== "number") return null;
    const c = String(p.currency || "EUR").toUpperCase();
    const t = TAUX_EUR[c]; if(t === undefined) return null;
    if(c !== "EUR") approx = true;
    return Math.round(p.value * t * 100) / 100;
  };
  const grade = GRADE_DISCOGS[etat] ? etat : "VG+";
  const value = toEur(j[GRADE_DISCOGS[grade]]);
  if(value === null) throw new Error("aucun prix suggéré pour cet état");
  return { value, grade, low: toEur(j[GRADE_DISCOGS["VG"]]), high: toEur(j[GRADE_DISCOGS["Near Mint"]]), approx, etatConnu: !!GRADE_DISCOGS[etat] };
}

async function discogsFetch(v, token, opts){
  const params = new URLSearchParams({ type:"release", token, per_page:"10", page:"1" });
  if(v.artiste) params.set("artist", v.artiste);
  if(v.titre) params.set("release_title", v.titre);
  if(v.catalogue) params.set("catno", v.catalogue);
  if(v.annee_impression) params.set("year", String(v.annee_impression));
  const res = await fetch("https://api.discogs.com/database/search?" + params.toString(), { headers: { "User-Agent":"VinylArchiveJacques/1.0" } });
  if(!res.ok){
    if(res.status === 401) throw new Error("Token Discogs invalide (401)");
    if(res.status === 429) throw new Error("Quota Discogs atteint (429)");
    throw new Error("Discogs HTTP " + res.status);
  }
  const json = await res.json();
  const results = (json.results || []).filter(r => r.type === "release");
  if(!results.length) throw new Error("Aucune correspondance Discogs");
  const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)|\[.*?\]/g,"").replace(/[^a-z0-9à-ÿ ]/g," ").replace(/\s+/g," ").trim();
  const tTitre = norm(v.titre), tArt = norm(v.artiste);
  let best = null, bestScore = -1;
  for(const r of results){
    const rTitre = norm(r.title);
    let score = 0;
    if(tArt && rTitre.includes(tArt)) score += 3;
    if(tTitre && rTitre.includes(tTitre)) score += 3;
    if(tTitre){ const words = tTitre.split(" ").filter(w => w.length > 2); words.forEach(w => { if(rTitre.includes(w)) score += 0.6; }); }
    if(v.catalogue && r.catno && norm(r.catno) === norm(v.catalogue)) score += 5;
    if(v.annee_impression && String(r.year) === String(v.annee_impression)) score += 1.5;
    if(r.community && r.community.have) score += Math.min(1.5, r.community.have / 400);
    if(score > bestScore){ bestScore = score; best = r; }
  }
  if(!best) throw new Error("Aucun résultat exploitable");
  let lowest = best.lowest_price ?? null;
  try {
    const r2 = await fetch(`https://api.discogs.com/marketplace/stats/${best.id}?token=${encodeURIComponent(token)}`, { headers:{ "User-Agent":"VinylArchiveJacques/1.0" } });
    if(r2.ok){ const stats = await r2.json(); if(stats && stats.lowest_price){ const lp = stats.lowest_price; lowest = (typeof lp === "object") ? lp.value : lp; } }
  } catch(e){}
   let suggest = null, suggestErr = null;
  if(!opts || opts.suggest !== false){
    try { suggest = await discogsSuggest(best.id, token, v.etat_disque); } catch(e){ suggestErr = e.message; }
  }
  return {
    suggest, suggestErr,
    value: lowest !== null && lowest !== undefined ? Number(lowest) : null,
    label: best.title + (best.year ? " · " + best.year : ""),
    url: best.uri ? "https://www.discogs.com" + best.uri : ("https://www.discogs.com/release/" + best.id),
    have: best.community ? best.community.have : null,
    want: best.community ? best.community.want : null
  };
}

async function audiodbFetch(v){
  const key = (Settings.data.audiodbKey || "123").trim() || "123";
  if(!v.artiste) throw new Error("Artiste requis pour TheAudioDB");
  const params = new URLSearchParams({ s: v.artiste });
  if(v.titre) params.set("a", v.titre);
  const res = await fetch(`https://www.theaudiodb.com/api/v1/json/${encodeURIComponent(key)}/searchalbum.php?` + params.toString());
  if(!res.ok){
    if(res.status === 429) throw new Error("Quota TheAudioDB atteint (429)");
    throw new Error("TheAudioDB HTTP " + res.status);
  }
  const json = await res.json();
  const albums = (json && json.album) || [];
  if(!albums.length) throw new Error("Aucune correspondance TheAudioDB");
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)|\[.*?\]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const tTitre = norm(v.titre);
  let best = albums[0], bestScore = -1;
  for(const a of albums){
    const n = norm(a.strAlbum);
    let score = 0;
    if(tTitre && n === tTitre) score += 5;
    else if(tTitre && (n.includes(tTitre) || tTitre.includes(n))) score += 3;
    if(v.annee_impression && String(a.intYearReleased) === String(v.annee_impression)) score += 1;
    if(a.strAlbumThumb) score += 0.5;
    if(score > bestScore){ bestScore = score; best = a; }
  }
  const bits = [best.strArtist, best.strAlbum].filter(Boolean).join(" – ");
  const extra = [best.intYearReleased, best.strGenre || best.strStyle, best.strLabel].filter(Boolean).join(" · ");
  return {
    label: bits + (extra ? " (" + extra + ")" : ""),
    cover: best.strAlbumThumbHQ || best.strAlbumThumb || null,
    url: best.idAlbum ? "https://www.theaudiodb.com/album/" + best.idAlbum : "https://www.theaudiodb.com/"
  };
}

}
function extractPricesFromHTML(html, selectors){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const prices = [];
  for(const sel of selectors){
    $$(sel, doc).forEach(el => {
      const txt = el.textContent.replace(/\s|\u00a0/g, "");
      const m = txt.match(/(\d{1,5}(?:[.,]\d{1,2})?)(?:€|EUR)/i);
      if(m){ const val = parseFloat(m[1].replace(",", ".")); if(val > 0.5 && val < 20000) prices.push(val); }
    });
    if(prices.length >= 5) break;
  }
  return prices;
}
function median(arr){
  if(!arr.length) return null;
  const s = [...arr].sort((a,b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid-1] + s[mid]) / 2;
}

async function estimateValue(v, onProgress){
  const { discogsToken, proxyUrl } = Settings.data;
  const out = { sources: [], heuristic: heuristicEstimate(v), average: null };
  const emit = () => { if(onProgress) onProgress(out); };
  out.sources.push({ name:"Estimation interne", status:"ok", value: out.heuristic, detail:"Modèle local (format · genre · année · pressage · état)" });
  emit();
  if(discogsToken){
    out.sources.push({ name:"Discogs", status:"loading" }); emit();
    try {
      const r = await discogsFetch(v, discogsToken);
      const src = out.sources[out.sources.length - 1];
      if(r.suggest){
        const g = r.suggest;
        const fourchette = (g.low !== null && g.high !== null) ? " · VG " + fmtEuro(g.low) + " → NM " + fmtEuro(g.high) : "";
        src.status = "ok"; src.value = g.value; src.url = r.url;
        src.detail = r.label + " — prix suggéré " + g.grade + (g.etatConnu ? "" : " (état non renseigné)") + fourchette + (g.approx ? " · devise convertie ≈" : "") + (r.value !== null ? " · annonce la + basse " + fmtEuro(r.value) : "");
      }
      else if(r.value !== null){ src.status = "ok"; src.value = r.value; src.detail = r.label + " — annonce la plus basse" + (r.suggestErr ? " (" + r.suggestErr + ")" : ""); src.url = r.url; }
      else { src.status = "info"; src.detail = r.label + " — aucun exemplaire en vente" + (r.suggestErr ? " (" + r.suggestErr + ")" : ""); src.url = r.url; }
    } catch(e){ const src = out.sources[out.sources.length - 1]; src.status = "err"; src.detail = e.message; }
    emit();
  } else {
    out.sources.push({ name:"Discogs", status:"off", detail:"Token non renseigné (Paramètres ⚙︎)" });
    emit();
  }
   {
    out.sources.push({ name:"TheAudioDB", status:"loading" }); emit();
    const src = out.sources[out.sources.length - 1];
    const key = String(Settings.data.audiodbKey || "").trim();
    if(!key){
      src.status = "off";
      src.detail = "Clé API non configurée (Paramètres ⚙︎)";
    } else {
      try {
        const r = await audiodbFetch(v);
        src.status = "info";
        src.detail = r.label + " — pas de prix (métadonnées)";
        src.url = r.url;
      } catch(e){
        const msg = String((e && e.message) || e);
        /* Les erreurs 404 et 429 viennent presque toujours d'une clé invalide ou épuisée */
        if(/HTTP 404|HTTP 429/.test(msg)){
          src.status = "err";
          src.detail = "Clé API invalide ou quota épuisé — vérifiez dans Paramètres ⚙︎ (clé gratuite : 123)";
        } else {
          src.status = "err";
          src.detail = msg;
        }
      }
    }
    emit();
  }
  if(proxyUrl){
    out.sources.push({ name:"eBay", status:"loading" }); emit();
    try {
      const q = [v.artiste, v.titre, v.format, v.annee_impression].filter(Boolean).join(" ");
      const target = "https://www.ebay.fr/sch/i.html?_nkw=" + encodeURIComponent(q) + "&LH_Sold=1&LH_Complete=1&_sop=13";
      const html = await proxiedFetch(target);
      const prices = extractPricesFromHTML(html, [".s-item__price", ".s-item .s-item__price", ".srp-results .s-item__price"]);
      const src = out.sources[out.sources.length - 1];
      if(prices.length >= 2){ src.status = "ok"; src.value = Math.round(median(prices) * 100) / 100; src.detail = median(prices).toFixed(2) + " € · médiane sur " + prices.length + " ventes"; src.url = target; }
      else { src.status = "err"; src.detail = "Aucune vente concluante trouvée"; }
    } catch(e){ const src = out.sources[out.sources.length - 1]; src.status = "err"; src.detail = e.message; }
    emit();
    out.sources.push({ name:"Vinted", status:"loading" }); emit();
    try {
      const q = [v.artiste, v.titre].filter(Boolean).join(" ");
      const target = "https://www.vinted.fr/catalog?search_text=" + encodeURIComponent(q) + "&order=price_low_to_high";
      const html = await proxiedFetch(target);
      const prices = extractPricesFromHTML(html, ["[data-testid$='price']", ".new-item-box__title + div", ".ItemBox-module__price"]);
      const src = out.sources[out.sources.length - 1];
      if(prices.length >= 2){ src.status = "ok"; src.value = Math.round(median(prices) * 100) / 100; src.detail = median(prices).toFixed(2) + " € · médiane sur " + prices.length + " annonces"; src.url = target; }
      else { src.status = "err"; src.detail = "Aucune annonce exploitable (page dynamique)"; }
    } catch(e){ const src = out.sources[out.sources.length - 1]; src.status = "err"; src.detail = e.message; }
    emit();
  } else {
    out.sources.push({ name:"eBay", status:"off", detail:"Proxy non configuré (Paramètres ⚙︎)" });
    out.sources.push({ name:"Vinted", status:"off", detail:"Proxy non configuré (Paramètres ⚙︎)" });
    emit();
  }
  const POIDS = { "Discogs":3, "eBay":2.5, "Vinted":1.5, "Estimation interne":1 };
  let sum = 0, wsum = 0;
  out.sources.forEach(s => { if(s.status === "ok" && typeof s.value === "number" && s.value > 0){ const w = POIDS[s.name] ?? 1; sum += s.value * w; wsum += w; } });
  out.average = wsum > 0 ? Math.round((sum / wsum) * 100) / 100 : null;
  emit();
  return out;
}

function normStr(s){ return String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function applyFilters(){
  const f = State.filters;
  const q = normStr(f.q.trim());
  State.filtered = State.vinyles.filter(v => {
    if(q){
      const hay = normStr([
        v.titre, v.artiste, v.label, v.catalogue, v.codebarres, v.genre, v.pays,
               v.notes, v.particularites, v.annee_impression, v.annee_enregistrement,
             v.emp_etagere, v.emp_bac, v.emp_position, v.emp_note,
        v.prete_a, v.date_pret, v.retour_prevu,
               v.format, v.pressage, v.pressage_audio, v.enregistrement, v.couleur_vinyle, v.acquisition,
        v.format_double ? "double album" : "",
        v.format_triple ? "triple album" : "",
        v.format_gatefold ? "gatefold pochette" : ""
      ].filter(Boolean).join(" "));
      const tokens = q.split(/\s+/).filter(Boolean);
      if(!tokens.every(t => hay.includes(t))) return false;
    }
    const eq = (val, filtre) => !filtre || normStr(val) === normStr(filtre);
    if(!eq(v.artiste, f.artiste)) return false;
    if(!eq(v.genre, f.genre)) return false;
    if(!eq(v.format, f.format)) return false;
    if(!eq(v.label, f.label)) return false;
    if(!eq(v.pays, f.pays)) return false;
    if(!eq(v.etat_disque, f.etat_disque)) return false;
    if(!eq(v.etat_pochette, f.etat_pochette)) return false;
    if(!eq(v.pressage, f.pressage)) return false;
    if(!eq(v.pressage_audio, f.pressage_audio)) return false;
    if(!eq(v.enregistrement, f.enregistrement)) return false;
    if(!eq(v.acquisition, f.acquisition)) return false;
        if(!eq(v.emp_etagere, f.emp_etagere)) return false;
        if(f.pret === "pretes" && !estPrete(v)) return false;
    if(f.pret === "dispo" && estPrete(v)) return false;
    if(!eq(v.rarete, f.rarete)) return false;
       if(f.double   && v.format_double   !== true) return false;
    if(f.triple   && v.format_triple   !== true) return false;
    if(f.gatefold && v.format_gatefold !== true) return false;
    if(f.annee){ const a = num(v.annee_impression); if(a === null || String(a) !== String(f.annee)) return false; }
    const val = valeurAffichee(v);
    if(f.vmin !== "" && f.vmin !== null && f.vmin !== undefined){ const min = num(f.vmin); if(min !== null && (val === null || val < min)) return false; }
    if(f.vmax !== "" && f.vmax !== null && f.vmax !== undefined){ const max = num(f.vmax); if(max !== null && (val === null || val > max)) return false; }
    return true;
  });
  sortFiltered();
}
function sortFiltered(){
  const s = State.sort, arr = State.filtered;
  const cmpStr = (a,b) => String(a||"").localeCompare(String(b||""), "fr", { sensitivity:"base" });
  const comparators = {
    date_ajout_desc: (a,b) => (b.date_ajout||"").localeCompare(a.date_ajout||""),
    date_ajout_asc: (a,b) => (a.date_ajout||"").localeCompare(b.date_ajout||""),
    valeur_desc: (a,b) => valeurEffective(b) - valeurEffective(a),
    valeur_asc: (a,b) => valeurEffective(a) - valeurEffective(b),
    rarete_desc: (a,b) => (RANG_RARETE[b.rarete] ?? -1) - (RANG_RARETE[a.rarete] ?? -1),
    annee_asc: (a,b) => (num(a.annee_impression) ?? 9999) - (num(b.annee_impression) ?? 9999),
    annee_desc: (a,b) => (num(b.annee_impression) ?? 0) - (num(a.annee_impression) ?? 0),
    artiste_asc: (a,b) => cmpStr(a.artiste, b.artiste),
    titre_asc: (a,b) => cmpStr(a.titre, b.titre),
    format_asc: (a,b) => cmpStr(a.format, b.format) || cmpStr(a.artiste, b.artiste)
  };
  arr.sort(comparators[s] || comparators.date_ajout_desc);
}

function fieldHTML(f, value, idPrefix="fld"){
  const id = `${idPrefix}_${f.key}`, val = value ?? "";

  const cls = f.span === 2 ? "field span2" : "field";
  const style = f.span === 2 ? 'style="grid-column:span 2"' : "";

  /* Cases à cocher */
  if(f.type === "checkbox"){
    const isChecked = val === true || val === "true" || val === 1 || val === "1";
    return `<div class="${cls}" ${style}>
      <label class="checkbox-field">
        <input type="checkbox" id="${id}" data-key="${esc(f.key)}" ${isChecked ? "checked" : ""}>
        <span>${esc(f.label)}</span>
      </label>
    </div>`;
  }
  if(f.type === "select"){
    const opts = [`<option value="">—</option>`].concat(f.options.map(o => `<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(o)}</option>`)).join("");
    return `<div class="${cls}" ${style}><label for="${id}">${esc(f.label)}</label><select id="${id}" data-key="${esc(f.key)}" ${req}>${opts}</select></div>`;
  }
  if(f.type === "textarea"){
    return `<div class="${cls}" ${style}><label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-key="${esc(f.key)}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea></div>`;
  }
  const step = f.step ? `step="${f.step}"` : "", list = f.list ? `list="${f.list}"` : "";
  return `<div class="${cls}" ${style}><label for="${id}">${esc(f.label)}</label><input id="${id}" data-key="${esc(f.key)}" type="${f.type}" value="${esc(val)}" placeholder="${esc(f.ph||"")}" ${step} ${list} ${req} ${ro}></div>`;
}

function fileToDataURL(file, maxSize){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image illisible"));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d"); ctx.imageSmoothingQuality = "high";
        ctx.fillStyle = "#0D0D0D"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.86));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function telecharger(nomFichier, contenu, mime){
  const blob = new Blob([contenu], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  ["pays","Pays"],["label","Label"],["catalogue","N° catalogue"],["codebarres","Code-barres"],

  ["valeur_auto","Valeur auto"],["valeur_manuelle","Valeur manuelle"]
];
function csvEscape(val){ const s = String(val ?? ""); if(/[";\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"'; return s; }
function buildCSV(items){
  const header = CSV_COLUMNS.map(c => csvEscape(c[1])).join(";");
  const rows = items.map(v => CSV_COLUMNS.map(c => {
    const raw = v[c[0]];
    if(typeof raw === "boolean") return raw ? "Oui" : "Non";
    return csvEscape(raw);
  }).join(";"));
  return "\uFEFF" + [header, ...rows].join("\r\n");
}

function openPrintWindow(title, bodyHTML){
  const w = window.open("", "_blank");
  if(!w){ toast("Impression bloquée", "Autorisez les fenêtres pop-up pour générer le PDF", true); return; }
  w.document.open(); w.document.write(buildPrintHTML(title, bodyHTML)); w.document.close(); w.focus();
  setTimeout(() => { try { w.print(); } catch(e){} }, 700);
}
function fichePrintBody(v){
  const valAff = valeurAffichee(v);
  const grid = GROUPS.map(g => {
    const items = g.fields.map(f => {
      let raw = v[f.key];
      if(f.type === "checkbox") return "";
      if(raw === null || raw === undefined || raw === "" || f.key === "valeur_auto" || f.key === "valeur_manuelle") return "";
      if(f.key === "notes" || f.key === "particularites") return "";
      if(f.type === "date"){ const d = new Date(raw); raw = isNaN(d) ? raw : d.toLocaleDateString("fr-FR"); }
      if(f.key === "prix_achat") raw = fmtEuro(num(raw));
      return `<div class="item"><div class="k">${esc(f.label)}</div><div class="v">${esc(raw)}</div></div>`;
    }).filter(Boolean).join("");
    /* Ajout des options de format comme items visibles */
    let extras = "";
    if(g.id === "ident"){
      const tags = formatTags(v);
      if(tags.length){
        extras = `<div class="item"><div class="k">Options de format</div><div class="v">${esc(tags.join(" · "))}</div></div>`;
      }
    }
    if(!items && !extras) return "";
    return `<h2>${esc(g.title)}</h2><div class="grid">${items}${extras}</div>`;
  }).join("");
  const extras = [];
  if(v.notes) extras.push(`<h2>Notes personnelles</h2><div class="notes">${esc(v.notes)}</div>`);
  if(v.particularites) extras.push(`<h2>Particularités</h2><div class="notes">${esc(v.particularites)}</div>`);
   const metaLines = [
    v.format,
    v.format_double ? "Double album" : "",
    v.format_triple ? "Triple album" : "",
    v.format_gatefold ? "Gatefold" : "",
    v.label,
    v.annee_impression
  ].filter(Boolean).map(esc).join("<br>");
  return `<div class="brand"><div><h1>${esc(v.titre || "Sans titre")}</h1><div class="sub">${esc(v.artiste || "")}</div></div>
    <div class="meta">${metaLines}</div></div>
    <div class="cols"><div class="cover">
      ${v.image_pochette ? `<img src="${esc(v.image_pochette)}" alt="">` : `<div class="ph">${esc(initiales(v.titre))}</div>`}
      ${v.image_pochette_verso ? `<img src="${esc(v.image_pochette_verso)}" alt="Verso" style="margin-top:10px;width:100%;border:1px solid #c8c0aa;display:block">` : ""}
      <div class="val-box"><div class="k">Valeur estimée</div><div class="v">${valAff === null ? "—" : fmtEuro(valAff)}</div></div>
    </div><div class="main">${grid}${extras.join("")}</div></div>`;
}
function collectionPrintBody(items){

      <td>${esc(formatBadge(v))}</td><td>${esc(v.annee_impression || "")}</td>
      <td>${esc(v.label || "")}</td><td>${esc(v.etat_disque || "")}</td>
      <td class="num">${valeurAffichee(v) === null ? "—" : fmtEuro(valeurAffichee(v))}</td>
    </tr>`).join("");
  return `<div class="brand"><div><h1>Collection de vinyles</h1><div class="sub">Vinyl Archive — Jacques Edition</div></div>
    <div class="meta">${items.length} vinyle${items.length>1?"s":""}<br>Valeur totale : <b>${fmtEuro(Math.round(total))}</b></div></div>

    <tbody>${rows}</tbody></table>`;
}

    @media print{

  </style>`;

  /* ═══════════════════════════════════════════════════════════════
     GROUPEMENT SELON LE MODE
     Retourne un tableau : [{ key, titre, kicker, subItems: [...] }]
     ═══════════════════════════════════════════════════════════════ */
  function grouperPar(liste, mode){
    const groupes = {};

    liste.forEach(v => {
      let cle, ordre;
      if(mode === "artiste"){
        const a = (v.artiste || "?").trim() || "?";
        cle = a;
        ordre = a.localeCompare("", "fr");
      } else if(mode === "annee"){
        const y = num(v.annee_impression);
        cle = y !== null ? String(y) : "Sans année";
        ordre = y !== null ? y : 999999;
      } else if(mode === "genre"){
        const g = (v.genre || "Non précisé").trim() || "Non précisé";
        cle = g;
        ordre = g;
      } else { /* decennie */
        const d = getDecade(v.annee_impression);
        cle = d !== null ? String(d) : "Sans année";
        ordre = d !== null ? d : 999999;
      }
      if(!groupes[cle]) groupes[cle] = { key: cle, items: [], ordre };
      groupes[cle].items.push(v);
    });

    /* Tri des groupes */
    const cles = Object.keys(groupes);
    if(mode === "artiste"){
      cles.sort((a,b) => {
        const la = premiereLettreTri(a), lb = premiereLettreTri(b);
        return la.localeCompare(lb, "fr") || a.localeCompare(b, "fr");
      });
    } else if(mode === "annee" || mode === "decennie"){
      cles.sort((a,b) => groupes[a].ordre - groupes[b].ordre);
    } else if(mode === "genre"){
      cles.sort((a,b) => a.localeCompare(b, "fr"));
    }

    /* Construction des groupes avec titre adapté */
    return cles.map(cle => {
      const g = groupes[cle];
      /* Tri interne */
      if(mode === "artiste"){
        g.items.sort((a,b) => (num(a.annee_impression) ?? 9999) - (num(b.annee_impression) ?? 9999)
                              || (a.titre || "").localeCompare(b.titre || "", "fr"));
      } else if(mode === "annee"){
        g.items.sort((a,b) => (a.artiste || "").localeCompare(b.artiste || "", "fr")
                              || (a.titre || "").localeCompare(b.titre || "", "fr"));
      } else if(mode === "genre"){
        g.items.sort((a,b) => (a.artiste || "").localeCompare(b.artiste || "", "fr")
                              || (a.titre || "").localeCompare(b.titre || "", "fr"));
      } else {
        g.items.sort((a,b) => (a.artiste || "").localeCompare(b.artiste || "", "fr")
                              || (a.titre || "").localeCompare(b.titre || "", "fr"));
      }

      let titre = cle, kicker = "Chapitre", taille = "";
      if(mode === "decennie" && cle !== "Sans année"){
        titre = formatDecade(parseInt(cle, 10));
      } else if(mode === "annee" && cle !== "Sans année"){
        titre = cle;
        taille = "small";
      } else if(mode === "artiste"){
        titre = cle;
        taille = "small";
      } else if(mode === "genre"){
        titre = cle;
        taille = "small";
      } else if(cle === "Sans année"){
        titre = "Sans année précisée";
      }
      return { titre, kicker, taille, items: g.items };
    });
  }

  const groupes = grouperPar(items, modeTri);
  const decennies = modeTri === "decennie" ? groupes.filter(g => g.titre.startsWith("Années")).length : 0;

  /* ─── Calcul des numéros de page ─── */
  let pg = 1;
  const toc = [];
  const pgCover = pg; pg++;
  const pgForeword = pg; pg++;
  const pgToc = pg; pg++;
  const pgGroupes = [];
  groupes.forEach(g => {
    const pgSep = pg; pg++;
    const pgFirst = pg;
    pg += g.items.length;
    pgGroupes.push({ sep: pgSep, first: pgFirst, count: g.items.length, groupe: g });
    toc.push({ label: g.titre, pg: pgSep, sub: g.items.length + " vinyle" + (g.items.length > 1 ? "s" : "") });
  });
  const pgMaster = pg; pg++;
  const pgStats = pg; pg++;
  const pgIndex = pg;

  /* ─── Couverture ─── */
  const cover = `
    <div class="cv-cover">
      <div class="il">${illustrationSVG}</div>
      <h1>Vinyl Archive</h1>
      <div class="sub">Jacques Edition</div>
      <div class="rule"></div>
      <p class="tagline">
        Votre collection, comme dans un vrai disquaire.<br>
        Une archive privée, un moteur de recherche, des fiches de musée <br>
        et la valeur de chaque pièce, mise à jour.
      </p>
      <div class="mode">${esc(modeLabel)}</div>
      <div class="meta">${items.length} vinyle${items.length>1?"s":""} · ${fmtEuro(Math.round(total))}</div>
      <div class="date">${dateGen}</div>
    </div>`;

  /* ─── Avant-propos ─── */
  let introP1 = `Ce catalogue rassemble <strong>${items.length} vinyle${items.length>1?"s":""}</strong>`;
  if(anneeMin && anneeMax) introP1 += `, du pressage de <strong>${anneeMin}</strong> au plus récent de <strong>${anneeMax}</strong>`;
  introP1 += `. `;
  if(artistes.size > 1) introP1 += `Ils représentent <strong>${artistes.size} artistes</strong> ou groupes`;
  else introP1 += `Il s'agit d'un artiste unique`;
  if(topArtiste) introP1 += `, avec <strong>${esc(topArtiste)}</strong> en tête du classement`;
  if(topGenre) introP1 += ` et le <strong>${esc(topGenre)}</strong> comme genre dominant`;
  introP1 += `. L'ensemble est aujourd'hui estimé à <strong>${fmtEuro(Math.round(total))}</strong>.`;

  const introP2 = modeTri === "artiste"
    ? `Les chapitres qui suivent regroupent les vinyles par artiste, dans l'ordre alphabétique.`
    : modeTri === "annee"
    ? `Les chapitres qui suivent suivent les années d'impression, millésime après millésime.`
    : modeTri === "genre"
    ? `Les chapitres qui suivent regroupent les vinyles par genre musical.`
    : `Les chapitres qui suivent suivent les décennies, comme une traversée du siècle dernier à nos jours.`;

  const introP3 = `Ce livre est à la fois un inventaire, un souvenir, et un point de repère — pour vous, et pour ceux qui, un jour, prendront soin de ces sillons.`;

  const foreword = `
    <div class="cv-foreword">
      <h2>Avant-propos</h2>
      <div class="lead">${esc(modeLabel)}</div>
      <div class="rule"></div>
      <p>${introP1}</p>
      <p>${introP2}</p>
      <p class="italic">${introP3}</p>
      <div class="sig">Jacques Edition</div>
      <div class="stats-mini">
        <div class="stat-mini"><div class="n">${items.length}</div><div class="l">Vinyles</div></div>
        <div class="stat-mini"><div class="n">${artistes.size}</div><div class="l">Artistes</div></div>
        <div class="stat-mini"><div class="n">${groupes.length}</div><div class="l">Chapitres</div></div>
        <div class="stat-mini"><div class="n">${fmtEuro(Math.round(total)).replace(/\s/g,"")}</div><div class="l">Valeur totale</div></div>
      </div>
      <div class="cv-footer">
        <span>Vinyl Archive · Jacques Edition</span>
        <span>Page ${pgForeword}</span>
      </div>
    </div>`;

  /* ─── Sommaire ─── */
  const tocRows = toc.map(t => `
    <div class="cv-toc-row">
      <span class="lbl">${esc(t.label)}</span>
      <span class="dots"></span>
      <span class="pg">${t.pg}</span>
    </div>
    <div class="cv-toc-row cv-toc-sub" style="border-bottom:none;padding-top:0">
      <span class="lbl">${esc(t.sub)}</span>
    </div>
  `).join("");
  const tocPage = `
    <div class="cv-toc">
      <h2>Sommaire</h2>
      <div class="cv-toc-row">
        <span class="lbl">Avant-propos</span>
        <span class="dots"></span>
        <span class="pg">${pgForeword}</span>
      </div>
      ${tocRows}
      <div class="cv-toc-row" style="margin-top:24px">
        <span class="lbl">Pièces maîtresses</span>
        <span class="dots"></span>
        <span class="pg">${pgMaster}</span>
      </div>
      <div class="cv-toc-row">
        <span class="lbl">Statistiques de la collection</span>
        <span class="dots"></span>
        <span class="pg">${pgStats}</span>
      </div>
      <div class="cv-toc-row">
        <span class="lbl">Index alphabétique</span>
        <span class="dots"></span>
        <span class="pg">${pgIndex}</span>
      </div>
      <div class="cv-footer">
        <span>Vinyl Archive · Jacques Edition</span>
        <span>Page ${pgToc}</span>
      </div>
    </div>`;

  /* ─── Séparateurs ─── */
  function sepPage(titre, taille, itemsCount, pgNum){
    return `
      <div class="cv-sep" style="page-break-after:always">
        <div class="kicker">Chapitre</div>
        <h2 class="${taille || ""}">${esc(titre)}</h2>
        <div class="count">${itemsCount} vinyle${itemsCount>1?"s":""}</div>
        <div class="rule"></div>
        <div class="cv-footer" style="position:absolute;bottom:14mm;left:8mm;right:8mm">
          <span>Vinyl Archive · Jacques Edition</span>
          <span>Page ${pgNum}</span>
        </div>
      </div>`;
  }

  /* ─── Page d'un vinyle ─── */
  function vinylePage(v, pgNum){
    const valAff = valeurAffichee(v);
    const items1 = [];
    const addItem = (k, val) => { if(val !== null && val !== undefined && val !== "") items1.push(`<div class="item"><div class="k">${esc(k)}</div><div class="v">${esc(val)}</div></div>`); };
    addItem("Artiste", v.artiste);
    addItem("Format", formatBadge(v));
    if(v.enregistrement) addItem("Enregistrement", v.enregistrement);
    if(v.genre) addItem("Genre", v.genre);
    if(v.annee_impression) addItem("Année d'impression", v.annee_impression);
    if(v.annee_enregistrement) addItem("Année d'enregistrement", v.annee_enregistrement);
    if(v.label) addItem("Label", v.label);
    if(v.catalogue) addItem("N° catalogue", v.catalogue);
    if(v.pays) addItem("Pays", v.pays);
    if(v.pressage) addItem("Pressage", v.pressage);
    if(v.pressage_audio) addItem("Pressage audio", v.pressage_audio);
    if(v.couleur_vinyle) addItem("Couleur", v.couleur_vinyle);
    if(v.rarete) addItem("Rareté", v.rarete);
    if(v.etat_disque) addItem("État disque", v.etat_disque);
    if(v.etat_pochette) addItem("État pochette", v.etat_pochette);
    if(v.acquisition) addItem("Acquisition", v.acquisition);
    if(v.date_achat) addItem("Date d'achat", v.date_achat);
    if(v.prix_achat) addItem("Prix d'achat", fmtEuro(num(v.prix_achat)));
    if(valAff !== null) addItem("Valeur estimée", fmtEuro(valAff));
    const emp = emplacementCourt(v);
    if(emp) addItem("⌂ Emplacement", emp);
    if(estPrete(v)) addItem("➜ Prêté à", v.prete_a);
    const badges = [];
    if(v.statut === "Recherché") badges.push(`<span class="cv-badge brick">★ Recherché</span>`);
    if(estPrete(v)) badges.push(`<span class="cv-badge gold">➜ Prêté</span>`);
    if(v.format_double) badges.push(`<span class="cv-badge gold">Double album</span>`);
    if(v.format_triple) badges.push(`<span class="cv-badge gold">Triple album</span>`);
    if(v.format_gatefold) badges.push(`<span class="cv-badge gold">Pochette gatefold</span>`);
    const notes = [];
    if(v.particularites) notes.push(`<div class="cv-page-notes"><div class="k">Particularités</div>${esc(v.particularites)}</div>`);
    if(v.notes) notes.push(`<div class="cv-page-notes"><div class="k">Notes</div>${esc(v.notes)}</div>`);
    return `
      <div class="cv-page" style="page-break-after:always">
        <div class="cv-page-head">
          <div class="num">N° ${String(pgNum).padStart(3,"0")}</div>
          <div class="brand">VINYL ARCHIVE</div>
        </div>
        <div class="cv-page-body">
          <div class="cv-page-cover">
            ${v.image_pochette ? `<img src="${esc(v.image_pochette)}" alt="">` : `<div class="ph">${esc(initiales(v.titre))}</div>`}
            ${v.image_pochette_verso ? `<img class="verso" src="${esc(v.image_pochette_verso)}" alt="Verso">` : ""}
          </div>
          <div class="cv-page-info">
            <h1>${esc(v.titre || "Sans titre")}</h1>
            <div class="artiste">${esc(v.artiste || "")}</div>
            ${badges.length ? `<div style="margin-bottom:16px">${badges.join("")}</div>` : ""}
            <div class="cv-page-grid">${items1.join("")}</div>
            ${notes.join("")}
          </div>
        </div>
        <div class="cv-footer">
          <span>Vinyl Archive · Jacques Edition</span>
          <span>Page ${pgNum}</span>
        </div>
      </div>`;
  }

  /* ─── Construction ─── */
  const pagesByGroupe = [];
  pgGroupes.forEach(({ sep, first, count, groupe }) => {
    pagesByGroupe.push(sepPage(groupe.titre, groupe.taille, count, sep));
    let pgn = first;
    groupe.items.forEach(v => {
      pagesByGroupe.push(vinylePage(v, pgn));
      pgn++;
    });
  });

  /* ─── Pièces maîtresses ─── */
  const top10 = [...items]
    .map(v => ({ v, val: valeurEffective(v) }))
    .filter(x => x.val > 0)
    .sort((a,b) => b.val - a.val)
    .slice(0, 10);
  const masterPage = `
    <div class="cv-masterpieces">
      <h2>Pièces maîtresses</h2>
      ${top10.length ? `
        <div class="grid">
          ${top10.map(({v, val}) => `
            <div class="cv-mp-item">
              <div class="cover">
                ${v.image_pochette ? `<img src="${esc(v.image_pochette)}" alt="">` : esc(initiales(v.titre))}
              </div>
              <div class="info">
                <div class="titre">${esc(v.titre || "Sans titre")}</div>
                <div class="artiste">${esc(v.artiste || "")}${v.annee_impression ? " · " + esc(v.annee_impression) : ""}</div>
                <div class="valeur">${fmtEuro(val)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      ` : `<p style="color:#777;font-style:italic">Aucune valeur renseignée pour le moment.</p>`}
      <div class="cv-footer">
        <span>Vinyl Archive · Jacques Edition</span>
        <span>Page ${pgMaster}</span>
      </div>
    </div>`;

  /* ─── Statistiques ─── */
  const parGenre = {};
  items.forEach(v => { const g = (v.genre || "Non précisé").trim() || "Non précisé"; parGenre[g] = (parGenre[g] || 0) + 1; });
  const topGenres = Object.entries(parGenre).sort((a,b) => b[1] - a[1]).slice(0, 6);
  const maxGenre = topGenres.length ? topGenres[0][1] : 1;
  const parArtiste = {};
  items.forEach(v => { const a = (v.artiste || "").trim(); if(a) parArtiste[a] = (parArtiste[a] || 0) + 1; });
  const topArtistes = Object.entries(parArtiste).sort((a,b) => b[1] - a[1]).slice(0, 6);
  const maxArtiste = topArtistes.length ? topArtistes[0][1] : 1;
  const moy = items.length ? Math.round(total / items.length) : 0;
  const rareCount = items.filter(v => ["Rare","Très rare","Collector"].includes(v.rarete)).length;
  const preteCount = items.filter(v => estPrete(v)).length;

  const statsPage = `
    <div class="cv-stats">
      <h2>Statistiques de la collection</h2>
      <div class="grid">
        <div class="cv-stat"><div class="k">Vinyles</div><div class="v">${items.length}</div></div>
        <div class="cv-stat"><div class="k">Valeur totale</div><div class="v">${fmtEuro(Math.round(total))}</div></div>
        <div class="cv-stat"><div class="k">Valeur moyenne</div><div class="v">${fmtEuro(moy)}</div></div>
        <div class="cv-stat"><div class="k">Pièces rares</div><div class="v">${rareCount}</div></div>
        <div class="cv-stat"><div class="k">Prêtées</div><div class="v">${preteCount}</div></div>
        <div class="cv-stat"><div class="k">Chapitres</div><div class="v">${groupes.length}</div></div>
      </div>
      ${topGenres.length ? `
        <div class="cv-stats-section">
          <h3>Top genres</h3>
          ${topGenres.map(([g, n]) => `
            <div class="cv-stat-bar">
              <div class="lbl">${esc(g)}</div>
              <div class="track"><div class="fill" style="width:${(n/maxGenre)*100}%"></div></div>
              <div class="val">${n}</div>
            </div>

        </div>

  /* ─── Index alphabétique ─── */
  const parLettre = {};
  items.forEach(v => {

    const lettre = (typeof premiereLettreTri === "function" ? premiereLettreTri(art) : art[0].toUpperCase());

    if(!parLettre[lettre][art]) parLettre[lettre][art] = [];

  });
   const lettres = Object.keys(parLettre).sort((a,b) =>
    (a === "#") - (b === "#") || a.localeCompare(b, "fr")
  );
  const indexRows = lettres.map(lettre => {
    const artistesList = Object.keys(parLettre[lettre]).sort((a,b) => a.localeCompare(b, "fr"));
    const contenu = artistesList.map(a => {

    }).join("<br>");
    return `<div class="cv-index-row"><div class="ltr">${esc(lettre)}</div><div class="list">${contenu}</div></div>`;

  return css + cover + foreword + tocPage + pagesByGroupe.join("") + masterPage + statsPage + indexPage;
}

function getDecade(year){
  const y = num(year);
  if(y === null || y < 1900) return null;
  return Math.floor(y / 10) * 10;
}
function formatDecade(d){
  return d < 2000 ? `Années ${d}` : `${d}+`;
}

function dashboardDecades(items){
  const counts = {};
  items.forEach(v => {
    const d = getDecade(v.annee_impression);
    if(d !== null) counts[d] = (counts[d] || 0) + 1;
  });
  const decades = Object.keys(counts).map(Number).sort((a,b) => a - b);
  if(!decades.length){
    return `<div class="dash-card"><div class="dash-title">Répartition par décennie</div><div class="dash-empty">Aucune année renseignée</div></div>`;
  }
  const max = Math.max(...Object.values(counts));
  const rows = decades.map(d => {
    const n = counts[d];
    const pct = max > 0 ? (n / max) * 100 : 0;
    return `<div class="dash-bar-row">
      <div class="dash-bar-label">${esc(formatDecade(d))}</div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${pct}%"></div></div>
      <div class="dash-bar-value">${n}</div>
    </div>`;
  }).join("");
  return `<div class="dash-card"><div class="dash-title">Répartition par décennie</div><div class="dash-bars">${rows}</div></div>`;
}

function dashboardTopArtists(items){

/* ═══════════════════════════════════════════════════════════════════
   FILTRE ALPHABÉTIQUE A → Z
   ═══════════════════════════════════════════════════════════════════ */
/* Retourne la première lettre alphabétique en ignorant les articles
   courants (The, A, An, Le, La, Les, L', El, Los, Las, Der, Die, Das, Il, Gli).
   Ex. : "The Beatles" → "B", "Les Rita Mitsouko" → "R". */
function premiereLettreTri(name){
  const s = String(name || "").trim();
  if(!s) return "";
  const ARTICLES = ["the","a","an","le","la","les","l","el","los","las","der","die","das","il","gli","un","une"];
  const words = s.split(/\s+/);
  /* On cherche le premier mot qui n'est pas un article */
  let cible = words[0];
  for(const w of words){
    const nettoye = w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
    if(!ARTICLES.includes(nettoye)){ cible = w; break; }
    cible = w; /* si tous les mots sont des articles, on prend le premier */
  }
  const first = cible[0].toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return /[A-Z]/.test(first) ? first : "#";
}

    document.head.appendChild(style);

    function updateLetterStates(){
      if(!State.vinyles.length){
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";

      const used = {};
            State.vinyles.forEach(v => {
        const first = premiereLettreTri(v.artiste || v.titre || "");
        if(!first) return;
        if(/[A-Z]/.test(first)) used[first] = true;
        else used["#"] = true;
      });

      bar.querySelectorAll(".alpha-btn").forEach(btn => {
        const l = btn.dataset.letter;
        if(l === "") return;
        if(used[l]) btn.classList.remove("disabled");
        else btn.classList.add("disabled");
      });
    }

    bar.addEventListener("click", e => {

    console.log("%c🔤 Filtre alphabétique activé", "color:#C9A86A;font-weight:bold");
  }

  if(document.readyState === "loading"){

(function(){
  function initBackup(){
    if(typeof App === "undefined" || typeof State === "undefined" || typeof telecharger === "undefined"){
      setTimeout(initBackup, 200);
      return;
    }
    if(window.__backupInit) return;
    window.__backupInit = true;

    const STORAGE_KEY = "vinylArchiveJacques.lastBackup";
    const INTERVAL_DAYS = 7;
    const INTERVAL_MS = INTERVAL_DAYS * 24 * 60 * 60 * 1000;

    function doBackup(isAuto){
      if(!State.vinyles.length){
        if(!isAuto) console.log("Sauvegarde ignorée : collection vide");
        return false;
      }
      const now = new Date();
      const payload = {
        app: "Vinyl Archive – Jacques Edition",
        version: 2,
        exporte_le: now.toISOString(),
        sauvegarde_auto: !!isAuto,
        nombre: State.vinyles.length,
        vinyles: State.vinyles
      };
      const dateStr = now.toISOString().slice(0, 10);
      const filename = `vinyl-archive-jacques-${dateStr}.json`;
      const json = JSON.stringify(payload, null, 2);

      telecharger(filename, json, "application/json;charset=utf-8");

      try {
        localStorage.setItem(STORAGE_KEY, String(now.getTime()));
      } catch(e){}

      if(isAuto){
        toast("Sauvegarde automatique", State.vinyles.length + " fiche(s) exportée(s) dans " + filename);
      } else {
        toast("Sauvegarde manuelle", filename);
      }
      updateBadge();
      return true;
    }

    function isBackupDue(){
      let last = 0;
      try {
        last = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
      } catch(e){}
      if(!last) return true;
      return (Date.now() - last) >= INTERVAL_MS;
    }

    function daysUntilNext(){
      let last = 0;
      try {
        last = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
      } catch(e){}
      if(!last) return 0;
      const diff = INTERVAL_MS - (Date.now() - last);
      if(diff <= 0) return 0;
      return Math.ceil(diff / (24 * 60 * 60 * 1000));
